# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# This repo ships no Go code, so there is no gomod ecosystem block (see
# docs/standards.md, "Dependency Management") — only the 11 workflows and 4
# composite actions under .github/, pinned to action versions that nothing
# else bumps.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    rebase-strategy: "auto"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "github_actions"
      - "type/ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      # Group all GitHub Actions updates
      actions:
        patterns:
          - "*"
