name: Check docs-map sync
description: >-
  Validate a repo's docs-map.yaml against the filesystem (Layer 2 of the
  documentation-sync standard) — every public package mapped, every mapped path exists,
  mount targets unique, generated tables current. See scripts/check-doc-sync.sh for the
  full rule list. Requires yq (mikefarah v4) on PATH — install it in a prior step; this
  action does not install it, since consumers already need yq for other steps in the
  same job (e.g. front-matter injection) and installing it twice wastes CI time.

inputs:
  root:
    description: Repo root to validate. Defaults to the caller's checkout root.
    required: false
    default: "."
  map:
    description: Path to docs-map.yaml. Defaults to <root>/docs-map.yaml or <root>/site/docs-map.yaml.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Validate docs map (code<->docs sync)
      shell: bash
      # Canonical script lives at the repo root of go-kure/.github; $GITHUB_ACTION_PATH
      # points at this action's dir (.github/actions/check-doc-sync), so three levels up
      # is that repo root. The script validates the CALLER's checked-out tree.
      #
      # Inputs are bound to env vars, not interpolated into the run: script directly —
      # GitHub substitutes ${{ }} expressions into the YAML source before bash ever
      # sees it, so a value containing quotes/backticks/$(...) would be parsed as shell
      # syntax, not data. env: passes it as an opaque process environment value instead.
      env:
        DOCSYNC_ROOT: ${{ inputs.root }}
        DOCSYNC_MAP: ${{ inputs.map }}
      run: |
        MAP_ARGS=()
        if [ -n "$DOCSYNC_MAP" ]; then
          MAP_ARGS=(--map "$DOCSYNC_MAP")
        fi
        bash "$GITHUB_ACTION_PATH/../../../scripts/check-doc-sync.sh" "$DOCSYNC_ROOT" "${MAP_ARGS[@]}"
