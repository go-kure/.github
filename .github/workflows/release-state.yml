name: Release / State

# What did a tag's publish run actually do? Runs scripts/release-state.sh for
# the calling repository and one of its tags, and writes the verdict and its
# evidence to the job summary. A release repo's own release-state.yml calls
# this from a workflow_dispatch, so an operator needs no checkout of this
# repository and no token of their own: the query runs under the calling
# repository's token and sees what that repository sees (go-kure/.github#209).
#
# Read-only. It reports a state; it does not recover anything. The recovery
# for each state is in standards/release-process.md.
#
# A caller sets `run-name: Release state ${{ inputs.tag }}` so each run's
# title names its tag; the release guide relies on that to pick a run in the
# Actions tab.

on:
  workflow_call:
    inputs:
      tag:
        description: 'The release tag to inspect (e.g. v0.2.0-beta.11)'
        type: string
        required: true

jobs:
  state:
    name: Release state
    runs-on: autops-kube-kure
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      # actions/checkout reads an empty `ref` as "the default branch", which would
      # run whatever script main holds instead of this workflow's own commit.
      - name: Require this workflow's own commit
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty, so release-state.sh cannot be checked out at this workflow's own commit."
            exit 1
          fi

      - name: Check out release-state.sh
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-tools
          sparse-checkout: |
            scripts/release-state.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Decide the state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          # The partial state's advice prints a publish-policy.sh command. The
          # script's own path is on this runner, so print one that fetches the
          # policy script at this workflow's own commit instead.
          RELEASE_STATE_POLICY_CMD: bash <(curl -fsSL https://raw.githubusercontent.com/${{ job.workflow_repository }}/${{ job.workflow_sha }}/scripts/release/publish-policy.sh)
        run: |
          set -uo pipefail
          # The same tag shape release-publish.yml accepts, matched against the
          # whole input: grep would match one line of a multi-line value. The
          # value is not echoed back, since it would land in a workflow command.
          tag_re='^v[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+|-beta\.[0-9]+|-rc\.[0-9]+)?$'
          if ! [[ "$TAG" =~ $tag_re ]]; then
            echo "::error::The tag input is not a release tag (vX.Y.Z, optionally -alpha.N, -beta.N or -rc.N)."
            exit 2
          fi
          out="$(mktemp)"
          # The step shell runs with -e: capture the exit instead of stopping
          # here, so the summary is written for an undetermined state too.
          rc=0
          bash .release-tools/scripts/release-state.sh "$REPO" "$TAG" >"$out" 2>&1 || rc=$?
          # The output quotes names from the repository (workflow and job
          # names), so no line of it may be read as a workflow command.
          stop_token="release-state-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$stop_token"
          cat "$out"
          echo "::$stop_token::"
          {
            echo "## Release state: \`$REPO\` \`$TAG\`"
            echo
            if [ "$rc" -ne 0 ]; then
              echo "**No state was determined (exit $rc).** Do not branch on this run; read the output below, fix the cause and dispatch again."
              echo
            fi
            # An indented code block, not a fence: no line of the output can
            # end it, whatever backticks the quoted names carry. A bare carriage
            # return is a line break in Markdown, so each one becomes a newline
            # first and every resulting line is indented.
            tr '\r' '\n' <"$out" | sed 's/^/    /'
            echo
            echo "What each state means and its recovery: https://github.com/go-kure/.github/blob/main/standards/release-process.md#determining-what-a-release-actually-did"
          } >>"$GITHUB_STEP_SUMMARY"
          # Exit 1 is `undetermined`: the run turns red so it is never read as an answer.
          exit "$rc"
