name: Release / Publish

on:
  workflow_call:
    inputs:
      go_module:
        description: 'Go module path for proxy refresh (e.g. github.com/go-kure/launcher)'
        type: string
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: autops-kube-kure
    # 20 to match kure's ci.yml test job: the -race suite needs ~12m for
    # pkg/kubernetes/internal/gen alone, and 15 left no headroom for setup.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential

      - name: Read Go version from mise.toml
        id: go-version
        run: |
          GO_VER=$(grep '^go = ' mise.toml | sed 's/go = "\(.*\)"/\1/')
          echo "version=$GO_VER" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache: true

      - name: Run tests
        env:
          CGO_ENABLED: "1"
        run: go test -v -race -timeout 15m ./...

  validate:
    name: Validate tag and changelog
    runs-on: autops-kube-kure
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      # `true` only for the highest stable tag; goreleaser's MAKE_LATEST and
      # deploy-docs' set_latest both come from it.
      latest: ${{ steps.latest.outputs.latest }}
      # `true` only for the highest stable tag of its own line (vX.Y); deploy-docs
      # writes that line's docs slot only then.
      docs: ${{ steps.latest.outputs.docs }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # actions/checkout reads an empty `ref` as "the default branch", which would
      # pair this workflow with whatever policy script main holds. Refuse instead.
      - name: Require this workflow's own commit
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty, so the publish policy cannot be checked out at this workflow's own commit."
            exit 1
          fi

      # Into a directory the caller's tree ignores for this job: nothing here
      # commits, and goreleaser runs in a job of its own.
      - name: Check out the publish policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts/release
          persist-credentials: false

      - name: Validate tag format and CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF##*/}"
          echo "Tag: $TAG"

          # Validate tag format
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+|-beta\.[0-9]+|-rc\.[0-9]+)?$' \
            || { echo "Invalid tag format: $TAG"; exit 1; }

          # Validate CHANGELOG has section for this tag
          # git-cliff produces format: ## [0.1.0] (without v prefix)
          VERSION_NO_V="${TAG#v}"
          if [ ! -f CHANGELOG.md ] || ! grep -q "^## \[${VERSION_NO_V}\]" CHANGELOG.md; then
            echo "CHANGELOG.md missing section for ${TAG} (expected: ## [${VERSION_NO_V}])"
            exit 1
          fi

      # Ensure a newly pushed tag does not go backwards within its own line
      # (vX.Y), in semver order; a backport on release/vX.Y is compared with its
      # own line only.
      #
      # Skipped on workflow_dispatch, which re-publishes a tag that already
      # exists: progression is a property of CREATING a tag, and this tag passed
      # the check when it was created. Checked again, a dispatch of an older tag
      # fails against a newer tag of its line, blocking goreleaser
      # (`needs: validate`) in exactly the recovery case dispatch exists to serve.
      # The tag-format check above is what rejects a non-tag ref here.
      - name: Check version progression
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: bash .release-tools/scripts/release/publish-policy.sh progression "$GITHUB_REF_NAME"

      - name: Decide whether this is the Latest release and owns its docs slot
        id: latest
        run: |
          LATEST=$(bash .release-tools/scripts/release/publish-policy.sh latest "$GITHUB_REF_NAME")
          DOCS=$(bash .release-tools/scripts/release/publish-policy.sh docs "$GITHUB_REF_NAME")
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "docs=$DOCS" >> "$GITHUB_OUTPUT"
          echo "Latest release: $LATEST"
          echo "Owns its line's docs slot: $DOCS"

  goreleaser:
    needs: [test, validate]
    runs-on: autops-kube-kure
    # 30 min generic margin: a cold cross-compile of a multi-target binary repo
    # (e.g. several GOOS/GOARCH) can exceed 15 min on the self-hosted runner and
    # get cancelled mid-build. Conservative cap that suits any consumer; repos
    # that build few/no targets finish well under it.
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      # Refuse to publish over a release that already exists on this tag.
      #
      # It is a step of the publishing job, not a job of its own, because of how
      # `gh run rerun --failed` selects jobs: it reschedules the jobs that
      # concluded `failure` plus the jobs downstream of them. A separate probe
      # job that succeeded on attempt 1 is carried over without running, and its
      # carried-over success still satisfies `needs:`. That is exactly how a
      # caller-side guard job is bypassed when this job failed after creating
      # the release object. A step here runs on every attempt that runs this
      # job: tag push, dispatch, full re-run, `--failed` and single-job re-runs.
      #
      # It is the first step because it needs only `gh` and the API: a refusal
      # costs no checkout, toolchain setup or build.
      #
      # KNOWN LIMIT: `--failed` and single-job re-runs resolve this reusable
      # workflow at the FIRST attempt's commit (FACT 1 in
      # scripts/release-state.sh; standards/release-process.md). They carry this
      # step only for a run whose first attempt already used a version with it.
      #
      # Three outcomes, not two. The probe's shapes, as measured for the
      # callers' identical guard: release present -> exit 0, no stderr; absent
      # -> exit 1 with "gh: Not Found (HTTP 404)".
      # Any other failure is UNDETERMINED and never read as absent, so a change
      # in that error wording degrades to undetermined, not to "no release".
      # Undetermined refuses on every path except attempt 1 of a tag push: that
      # is a first publication, which must not be blocked by an API error, so
      # there it warns and proceeds. A release that does exist is refused on
      # every path, that one included.
      #
      # Drafts are not seen, and that is accepted: this lookup returns published
      # releases only and answers 404 for a draft. Per GoReleaser's publish
      # docs, every GitHub release stays a draft until its uploads finish, so a
      # run that fails mid-upload leaves a draft that was never public. With the
      # callers' settings (`draft: false`, neither `use_existing_draft` nor
      # `replace_existing_draft`) a re-run then creates a new release and leaves
      # the stale draft behind; it never publishes over a live release.
      # Refusing on a draft would block exactly that recovery.
      #
      # The callers' own guard jobs apply the same rule and stay in place for
      # now; on a first publication both see a 404 and proceed.
      - name: Refuse to publish over a tag that already has a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          # A re-run replays the original event context, so event_name stays
          # `push` on attempt 2+; the attempt has to be tested as well. The same
          # expression as the callers' guard, kept verbatim (run_attempt is a
          # string; this is the exact complement of a `> 1` re-publication
          # test) so the two classify every attempt identically.
          FIRST_PUBLICATION: ${{ github.event_name == 'push' && !(github.run_attempt > 1) }}
        run: |
          # Probe up to 3 times, 5s apart, stopping at the first determinate
          # answer, so the first-publication waiver below rides on a persistent
          # outage rather than a single 403/429/network blip.
          attempt=0
          while : ; do
            attempt=$((attempt + 1))
            set +e
            err=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>&1 >/dev/null)
            rc=$?
            set -e
            case "${rc}:${err}" in
              0:*|*"(HTTP 404)"*) break ;;
            esac
            if [ "$attempt" -ge 3 ]; then
              break
            fi
            echo "Probe attempt ${attempt} for $TAG was undetermined ($err); retrying in 5s"
            sleep 5
          done
          if [ "$rc" -eq 0 ]; then
            # States what this step can see -- the release object exists, and
            # this check keeps refusing while it does -- and nothing about
            # whether publication succeeded. It runs in the calling repository,
            # so it names where the state tool lives, not a path relative to it.
            echo "::error::$TAG already has a GitHub release, so this" \
                 "${GITHUB_EVENT_NAME} (attempt ${GITHUB_RUN_ATTEMPT}) would publish over a" \
                 "live release object. This does not by itself mean publication succeeded --" \
                 "a run that failed after GoReleaser published the release leaves one too." \
                 "Re-running is not a recovery from here: this check refuses for as long as" \
                 "the release exists. Determine the state with scripts/release-state.sh from" \
                 "go-kure/.github (documented in its standards/release-process.md) before acting."
            exit 1
          fi
          case "$err" in
            *"(HTTP 404)"*)
              echo "No release exists for $TAG; proceeding with publication"
              ;;
            *)
              if [ "$FIRST_PUBLICATION" = "true" ]; then
                # Residual hole, accepted: if the release exists AND the API
                # cannot answer, this proceeds over it. Refusing instead would
                # block every first publication on an API outage.
                echo "::warning::could not determine whether $TAG already has a release: $err"
                echo "Proceeding anyway: attempt 1 of a tag push is a first publication," \
                     "which must not be blocked by an API error. A release that does exist" \
                     "is still refused above; only an UNDETERMINED answer is waived here."
              else
                echo "::error::could not determine whether $TAG already has a release: $err"
                exit 1
              fi
              ;;
          esac

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Read Go version from mise.toml
        id: go-version
        run: |
          GO_VER=$(grep '^go = ' mise.toml | sed 's/go = "\(.*\)"/\1/')
          echo "version=$GO_VER" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache: true

      # cosign-installer v4's install script requires envsubst, which the
      # autops-kube-kure runner image does not ship (first hit: launcher
      # v0.1.0-alpha.21 release-publish, 2026-08-21, exit 127).
      - name: Install envsubst (needed by cosign-installer v4)
        run: |
          command -v envsubst >/dev/null 2>&1 || {
            sudo apt-get update -qq && sudo apt-get install -y -qq gettext-base
          }

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # actions/checkout reads an empty `ref` as "the default branch", which would
      # pair this workflow with whatever installer main holds. Refuse instead.
      - name: Require this workflow's own commit
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty, so the git-cliff installer cannot be checked out at this workflow's own commit."
            exit 1
          fi

      - name: Check out the git-cliff installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .git-cliff-installer
          sparse-checkout: scripts/release
          persist-credentials: false

      - name: Install git-cliff
        run: |
          # Pinned, not latest, so the notes a release ships are rendered by a
          # known binary. Renovate bumps this pin together with the other
          # git-cliff pins (customManagers in renovate.json, one depName).
          # renovate: datasource=github-releases depName=orhun/git-cliff
          CLIFF_VERSION="2.14.2"
          # Verifies the upstream signature against the key pinned in the
          # script before installing (go-kure/.github#227).
          bash .git-cliff-installer/scripts/release/install-git-cliff.sh "$CLIFF_VERSION"
          # GoReleaser refuses a dirty tree, and the installer checkout sits
          # inside the caller's one as an untracked directory.
          rm -rf .git-cliff-installer

      # --use-branch-tags: the notes run from the previous tag on this tag's own
      # branch, so a backport's notes hold only the backport, and a main release
      # after a backport does not repeat it. scripts/test/release-test.sh runs
      # this exact command.
      - name: Extract release notes
        run: git-cliff --latest --use-branch-tags --strip header -o release-notes.md

      # The callers' .goreleaser.yml sets `make_latest: "{{ .Env.MAKE_LATEST }}"`,
      # and GoReleaser fails on an unset variable, so it is set on every path.
      # Empty means validate's output did not reach this job; refuse rather than
      # guess which release GitHub should call Latest.
      - name: Require the Latest decision
        env:
          MAKE_LATEST: ${{ needs.validate.outputs.latest }}
        run: |
          case "$MAKE_LATEST" in
            true|false) echo "MAKE_LATEST=$MAKE_LATEST" ;;
            *) echo "::error::validate did not decide whether $GITHUB_REF_NAME is the Latest release (got '$MAKE_LATEST'). Re-run the whole run, not only the failed jobs."; exit 1 ;;
          esac

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          # Exact pin, not the "~> v2" floating constraint: matches meta's
          # REQUIRED_GORELEASER_VERSION (org-wide authority) and what the GitLab
          # side already pins exactly. A float here means "whatever v2.x is newest
          # the moment this release job happens to run" — unreproducible builds.
          version: "2.18.0"
          args: release --clean --release-notes release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAKE_LATEST: ${{ needs.validate.outputs.latest }}

  deploy-docs:
    name: Deploy versioned docs
    needs: [validate, goreleaser]
    runs-on: autops-kube-kure
    timeout-minutes: 5
    if: "!contains(github.ref_name, '-')"
    permissions:
      actions: write
      contents: read
    steps:
      - name: Trigger versioned docs deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only the highest stable tag moves the docs site's `latest`; a
          # backport deploys its own line's slot only.
          SET_LATEST: ${{ needs.validate.outputs.latest }}
          # The slot vX.Y belongs to the line's highest stable tag: an older
          # patch re-published (a dispatch) deploys nothing.
          DOCS_SLOT: ${{ needs.validate.outputs.docs }}
        run: |
          case "$SET_LATEST/$DOCS_SLOT" in
            true/true|false/true|false/false) ;;
            *) echo "::error::validate did not decide the docs deploy for $GITHUB_REF_NAME (latest='$SET_LATEST', docs='$DOCS_SLOT')."; exit 1 ;;
          esac
          TAG="${GITHUB_REF##*/}"
          # Extract minor version: v0.1.0 → v0.1
          MINOR="${TAG%.*}"
          if [ "$DOCS_SLOT" = false ]; then
            echo "::notice::Not deploying docs: a newer stable tag of ${MINOR} exists and owns the ${MINOR} docs slot."
            exit 0
          fi
          echo "Triggering docs deployment: tag=${TAG}, slot=${MINOR}"
          gh workflow run deploy-docs.yml \
            --repo "${{ github.repository }}" \
            --ref "${TAG}" \
            -f version_slot="${MINOR}" \
            -f version_label="${TAG}" \
            -f set_latest="${SET_LATEST}"

  post-release:
    needs: goreleaser
    runs-on: autops-kube-kure
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Refresh Go module proxy
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF##*/}"
          MODULE="${{ inputs.go_module }}"
          PROXY_URL="https://proxy.golang.org/${MODULE}/@v/${TAG}.info"

          echo "Refreshing Go module proxy for ${MODULE}@${TAG}"

          # Retry with exponential backoff
          MAX_RETRIES=3
          RETRY_DELAY=5

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES..."
            HTTP_CODE=$(curl -s -o /tmp/proxy_response.txt -w "%{http_code}" "$PROXY_URL")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Successfully refreshed proxy for ${TAG}"
              cat /tmp/proxy_response.txt

              # Verify module is available
              VERIFY_URL="https://proxy.golang.org/${MODULE}/@v/list"
              if curl -s "$VERIFY_URL" | grep -q "^${TAG}$"; then
                echo "Verified: ${TAG} is now available on proxy.golang.org"
                exit 0
              else
                echo "Warning: ${TAG} refresh succeeded but not yet in version list"
                exit 0
              fi
            fi

            echo "Proxy returned HTTP ${HTTP_CODE}, retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
            RETRY_DELAY=$((RETRY_DELAY * 2))
          done

          echo "Warning: Failed to refresh proxy after ${MAX_RETRIES} attempts (HTTP ${HTTP_CODE})"
          echo "The module may still become available after some delay"
          # Don't fail the release for proxy issues
          exit 0
