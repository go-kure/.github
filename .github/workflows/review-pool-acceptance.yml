# review-pool-acceptance: one hand-triggered review on the review scale set.
#
# This workflow is the review acceptance job for the review runner pool. One other workflow targets
# that pool, pr-review-runner-boundary-probe.yml, and it holds no secret and calls no model by
# design: it tests the process boundary with a stub. So no job has ever completed a real review
# there. This one is the smallest job that does: it runs one review with the sandbox turned off, and
# it records what ran, where it ran, and what came out.
#
# Three facts about the pool decide the shape of this file.
#
# 1. The pool pods run with hostUsers set to false, so the worker nodes need the sysctl
#    user.max_user_namespaces above zero. The identity step below reads that value inside the pod
#    and records it. A pod that starts at all proves the node carries it, and the recorded number
#    makes the proof readable afterwards.
# 2. The pool image installs no bubblewrap, so every review in it passes --sandbox none. The job's
#    own container is the boundary. A review that tried the default sandbox would fail to launch.
# 3. The image bakes no credential. Each job supplies its own backend credential. The runner renames
#    nothing: it hands its own environment to the backend binary, so the variable that matters is the
#    one that binary reads. claude reads CLAUDE_CODE_OAUTH_TOKEN, codex reads OPENAI_API_KEY, and an
#    opencode backend reads the key of the provider its own name selects. This organization holds
#    CLAUDE_CODE_OAUTH_TOKEN and OPENAI_API_KEY, so claude, codex and opencode:openai run here. The
#    credential step refuses any backend whose key is absent, by name and with the reason, instead of
#    launching a review that cannot authenticate.
#
# The second of those three facts decides what this job may review. The review reads its checkout
# with the credential in its environment and no sandbox around it, so the reviewed commits have to
# be code this repository carries. The revision input is free-form and actions/checkout takes it as
# a ref, and a fork pull request's head is a real ref of this repository, so the resolve step tests
# both the revision and the base for reachability from refs/remotes/origin/ or refs/tags/, the two
# namespaces this checkout fills from this repository's own branches and tags. A fork head is not
# there: checkout fetches it into refs/remotes/pull/, which is why the test names its trusted refs
# instead of asking git for every remote-tracking ref. An empty trusted set is refused first and
# separately, so a fetch that created no trusted ref cannot read as nothing to object to.
#
# The image digest is not readable from inside the pod: a job has no Kubernetes credential, and the
# scale set pulls the latest tag. So the identity step records two things in its place. The bundle
# record is the deterministic record of /opt/review-runner, taken by the image's own
# review-bundle-verify, and its sha256 identifies the bytes this review ran. The registry digest of
# the latest tag is read over the network as a cross-check, and when that read fails the record says
# "unavailable" with the reason. An unknown is never recorded as a success.

name: Review Pool Acceptance

on:
  workflow_dispatch:
    inputs:
      backend:
        description: >-
          The review-run --backend value: claude, codex, or opencode:<provider>/<model>. This
          organization holds credentials for claude, codex and the openai provider of opencode.
          A backend whose credential is absent stops at the credential step, with the reason.
        type: string
        required: false
        default: 'claude'
      revision:
        description: >-
          The commit of this repository to review. Empty takes the head of the ref the dispatch ran
          on. The job records the full object id either way.
        type: string
        required: false
        default: ''
      base:
        description: >-
          The base of the reviewed range. Empty takes the first parent of the revision.
        type: string
        required: false
        default: ''
      effort:
        description: >-
          The review-run --effort value, high or medium. Empty leaves the backend default.
        type: string
        required: false
        default: ''

concurrency:
  group: review-pool-acceptance-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  review:
    name: Review pool acceptance
    runs-on: autops-kube-review
    timeout-minutes: 45
    permissions:
      contents: read

    env:
      # The review runs under the job's own container, which is the boundary the image was built
      # for. See fact 2 in the header.
      REVIEW_SANDBOX: none
      REVIEW_BACKEND: ${{ inputs.backend }}
      REVIEW_EFFORT: ${{ inputs.effort }}
      REVIEW_BASE_INPUT: ${{ inputs.base }}
      REVIEW_IMAGE: ghcr.io/ginsys/opsmaster/actions-runner-review

    steps:
      - name: Record the pod this review runs in
        run: |
          set -euo pipefail
          # The runner context is not available in job-level env, so the two directories are set
          # here and carried to the later steps through the job environment file.
          RECORD_DIR="$RUNNER_TEMP/acceptance"
          OUT_DIR="$RECORD_DIR/out"
          printf 'RECORD_DIR=%s\n' "$RECORD_DIR" >> "$GITHUB_ENV"
          printf 'OUT_DIR=%s\n' "$OUT_DIR" >> "$GITHUB_ENV"
          mkdir -p "$RECORD_DIR"
          record="$RECORD_DIR/pod.txt"

          # The bundle record is the identity of the bytes this review runs. It stands in for the
          # image digest, which a pod cannot read. See the header.
          review-bundle-verify record /opt/review-runner > "$RECORD_DIR/bundle.record"
          bundle_sha="$(sha256sum "$RECORD_DIR/bundle.record" | cut -d' ' -f1)"

          # The registry digest of the latest tag, as a cross-check only. The scale set pulls that
          # tag on every pod start, so the two agree unless the tag moved during this job. A failed
          # read is recorded as unavailable with its reason, never as empty or as a pass.
          digest='unavailable: not attempted'
          if token="$(curl -fsS --max-time 30 \
                "https://ghcr.io/token?service=ghcr.io&scope=repository:ginsys/opsmaster/actions-runner-review:pull" \
                | jq -er .token)"; then
            if headers="$(curl -fsS --max-time 30 -o /dev/null -D - \
                  -H "Authorization: Bearer $token" \
                  -H 'Accept: application/vnd.oci.image.index.v1+json' \
                  -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
                  -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
                  -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
                  "https://ghcr.io/v2/ginsys/opsmaster/actions-runner-review/manifests/latest")"; then
              found="$(printf '%s' "$headers" | tr -d '\r' \
                | sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: //p' | tail -1)"
              if [ -n "$found" ]; then
                digest="$found"
              else
                digest='unavailable: the manifest response carried no content digest header'
              fi
            else
              digest='unavailable: the manifest read failed'
            fi
          else
            digest='unavailable: the registry token read failed'
          fi

          {
            printf 'pod_hostname=%s\n' "$(hostname)"
            printf 'uid=%s gid=%s\n' "$(id -u)" "$(id -g)"
            printf 'user_max_user_namespaces=%s\n' "$(cat /proc/sys/user/max_user_namespaces)"
            printf 'bundle_record_sha256=%s\n' "$bundle_sha"
            printf 'registry_latest_digest=%s\n' "$digest"
            printf 'review_run_path=%s\n' "$(command -v review-run)"
            printf 'runner_scripts_pin=%s\n' "$(sha256sum /opt/review-runner/bin/runner.sha256 | cut -d' ' -f1)"
          } | tee "$record"

          printf 'BUNDLE_RECORD_SHA256=%s\n' "$bundle_sha" >> "$GITHUB_ENV"
          printf 'REGISTRY_LATEST_DIGEST=%s\n' "$digest" >> "$GITHUB_ENV"

      - name: Check out the revision to review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision }}
          # The whole history, because the reviewed range needs the base commit.
          fetch-depth: 0
          # The review reads the checkout. It gets no token.
          persist-credentials: false

      - name: Resolve the reviewed range
        run: |
          set -euo pipefail
          rev="$(git rev-parse --verify HEAD)"
          if [ -n "$REVIEW_BASE_INPUT" ]; then
            base="$(git rev-parse --verify "${REVIEW_BASE_INPUT}^{commit}")"
          else
            base="$(git rev-parse --verify "${rev}^")"
          fi

          # The reviewed content reaches a review that runs with the sandbox off and this
          # organization's backend credential in its environment, so the reviewed commits have to be
          # code this repository itself carries. The revision input is free-form and actions/checkout
          # takes it as a ref, and a fork pull request's head is a real ref of this repository at
          # refs/pull/N/head, so a dispatch can name outside content without any write access here.
          #
          # The test is reachability from a trusted ref, and the trusted set is named here rather
          # than left to git's own idea of a remote. At fetch-depth 0 the pinned checkout always
          # fetches +refs/heads/*:refs/remotes/origin/* and +refs/tags/*:refs/tags/*, and when the
          # requested ref is refs/pull/N/head it ALSO fetches that head into refs/remotes/pull/N/head.
          # So "every remote-tracking ref" includes the fork head, and a test over all of them admits
          # the content it exists to refuse. Only refs/remotes/origin/ and refs/tags/ come from this
          # repository's own branches and tags, and creating either needs write access here.
          #
          # Tags are trusted on purpose: a commit this organization tagged is code this repository
          # carries, and a branch that once held it may since have been deleted, which a
          # branches-only test would refuse.
          #
          # Both endpoints are tested, because the revision decides the tree the review reads and the
          # base decides the diff. The empty trusted set is refused first and separately, so a fetch
          # that created no trusted ref cannot read as "nothing to object to", and the dispatcher is
          # told which of the two happened.
          TRUSTED=(refs/remotes/origin/ refs/tags/)
          if [ -z "$(git for-each-ref --format='%(refname)' "${TRUSTED[@]}")" ]; then
            echo "::error::no branch or tag of this repository was fetched, so no commit here can be shown to be code this repository carries." >&2
            echo "::error::The review holds this organization's backend credential. Refusing rather than reviewing unverified content." >&2
            exit 1
          fi
          for pair in "revision:$rev" "base:$base"; do
            name="${pair%%:*}"
            commit="${pair#*:}"
            if [ -z "$(git for-each-ref --contains "$commit" --format='%(refname)' "${TRUSTED[@]}")" ]; then
              echo "::error::the reviewed ${name} ${commit} is reachable from no branch or tag of this repository." >&2
              echo "::error::It is outside content, such as a fork pull request head, which checkout fetches into refs/remotes/pull/. The review holds this organization's backend credential, so it reads only code this repository carries." >&2
              exit 1
            fi
          done

          printf 'reviewed revision %s\nreviewed base     %s\n' "$rev" "$base"
          printf 'REVIEW_REVISION=%s\n' "$rev" >> "$GITHUB_ENV"
          printf 'REVIEW_BASE=%s\n' "$base" >> "$GITHUB_ENV"

      - name: Check the backend credential
        # Each secret reaches this step only for the backends whose own arm below reads it. The
        # review step is gated the same way and for the real reason; this step is gated to match, so
        # a gate that names the wrong backend fails here, on a named credential, instead of in the
        # review. That is also what makes the gate testable: every arm below already refuses an
        # empty value, so a gate that withholds a credential the backend needs is a red case and
        # not a silent downgrade.
        #
        # The condition reads inputs.backend and not REVIEW_BACKEND, because a step's env block is
        # evaluated before the step runs and cannot see a value another step wrote to GITHUB_ENV.
        # The two hold the same value: REVIEW_BACKEND is inputs.backend, set once at the job.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.backend == 'claude' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          OPENAI_API_KEY: ${{ (inputs.backend == 'codex' || startsWith(inputs.backend, 'opencode:openai/')) && secrets.OPENAI_API_KEY || '' }}
          CODEX_API_KEY: ${{ inputs.backend == 'codex' && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ startsWith(inputs.backend, 'opencode:anthropic/') && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          set -euo pipefail
          # The runner renames no credential: it passes its own environment to the backend binary,
          # so the variable each arm checks is one that binary reads for itself. Where a backend
          # reads more than one name, every name it reads is checked, because a credential present
          # under the wrong name is the same failure as no credential at all.
          case "$REVIEW_BACKEND" in
            claude)
              if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
                echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty. The claude backend cannot run." >&2
                exit 1
              fi
              echo "the claude credential is present"
              ;;
            codex)
              # codex reads two names for one credential, so both are checked and both carry the
              # same organization OpenAI key. Its noninteractive authentication reads
              # CODEX_API_KEY, and its openai provider configuration reads OPENAI_API_KEY; the
              # binary at the pinned version carries both names. Setting both reaches no secret
              # that one of them alone does not, since the value is the same key either way, and
              # it leaves no path where the backend this job exists to accept cannot authenticate.
              if [ -z "${CODEX_API_KEY:-}" ]; then
                echo "::error::CODEX_API_KEY is empty. The codex backend cannot authenticate." >&2
                exit 1
              fi
              if [ -z "${OPENAI_API_KEY:-}" ]; then
                echo "::error::OPENAI_API_KEY is empty. The codex backend cannot run." >&2
                exit 1
              fi
              echo "the codex credential is present under both names"
              ;;
            opencode:openai/*)
              if [ -z "${OPENAI_API_KEY:-}" ]; then
                echo "::error::OPENAI_API_KEY is empty. Backend ${REVIEW_BACKEND} cannot run." >&2
                exit 1
              fi
              echo "the openai credential is present for ${REVIEW_BACKEND}"
              ;;
            opencode:anthropic/*)
              if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
                echo "::error::ANTHROPIC_API_KEY is empty. Backend ${REVIEW_BACKEND} cannot run." >&2
                exit 1
              fi
              echo "the anthropic credential is present for ${REVIEW_BACKEND}"
              ;;
            opencode:*)
              echo "::error::backend ${REVIEW_BACKEND} names a provider with no credential here." >&2
              echo "::error::This organization holds keys for openai and anthropic only." >&2
              exit 1
              ;;
            *)
              echo "::error::backend ${REVIEW_BACKEND} has no credential in this organization." >&2
              exit 1
              ;;
          esac

      - name: Run one review with the sandbox turned off
        id: review
        # This step is why the gate exists. The review runs with the sandbox off, and the runner
        # hands its whole environment to the backend binary, which reads the content of the reviewed
        # range. A credential in that environment that the chosen backend does not use is reachable
        # by anything that content can persuade the backend to do, and it buys nothing, because no
        # arm of the step above reads it for this backend either.
        #
        # The reachability guard earlier in this job narrows what content can get here to code this
        # repository carries. It does not close this: an organization member's unmerged branch is
        # trusted content by that test and is reviewed with the credential present.
        #
        # Keep these three conditions identical to the ones on the credential step. They are two
        # copies on purpose, since a step env block cannot be shared, and the suite asserts both.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.backend == 'claude' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          OPENAI_API_KEY: ${{ (inputs.backend == 'codex' || startsWith(inputs.backend, 'opencode:openai/')) && secrets.OPENAI_API_KEY || '' }}
          CODEX_API_KEY: ${{ inputs.backend == 'codex' && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ startsWith(inputs.backend, 'opencode:anthropic/') && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          set -euo pipefail
          # review-run refuses an output directory that already holds a result.
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          effort=()
          if [ -n "$REVIEW_EFFORT" ]; then
            effort=(--effort "$REVIEW_EFFORT")
          fi

          # review-run reads the material from stdin and hands it to the backend as a regular
          # file; --base only records provenance. With nothing on stdin the reviewer would see no
          # diff at all and would be guessing at a range the record names.
          #
          # These options are review-run's own MATERIAL_DIFF list, copied. A copy can drift from
          # the runner's definition, so nothing here relies on the copy being right: the runner
          # records input_sha256 for the bytes it read on stdin and material_sha256 for its own
          # canonical diff of the same range, and the step below fails when the two disagree. A
          # drift is then a failed acceptance run naming both digests, not a silent formatting
          # difference between what the reviewer read and what the record claims.
          # The list is not fixed. The runner uses --no-renames normally and -M100% instead when
          # the range binds exact renames, which it reads as: every blob that is both deleted and
          # added is deleted once, added once, and is not the empty blob. That single token decides
          # the bytes, so a range holding one exact rename gets a different canonical diff, and a
          # generator that always passes --no-renames would review the right range in the wrong
          # shape. The condition is reproduced here from the raw diff, and the reproduction is the
          # part to distrust: a path holding a newline desynchronises the header and path records
          # below, which is why the runner reads them NUL-separated and this cannot. That is
          # tolerable only because of the digest check: a wrong verdict here picks the wrong option
          # list, the two digests disagree, and the run fails naming both. It never reviews the
          # wrong bytes quietly.
          head_oid="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          empty_blob="$(git -C "$GITHUB_WORKSPACE" hash-object -t blob /dev/null)"
          rename_option=--no-renames
          if git -C "$GITHUB_WORKSPACE" diff --raw -z --no-renames --no-ext-diff \
               --no-textconv --no-abbrev --ignore-submodules=none -O/dev/null \
               "$REVIEW_BASE" "$head_oid" \
             | tr '\0' '\n' \
             | awk -v empty="$empty_blob" '
                 NR % 2 == 1 && $1 ~ /^:/ {
                   if ($5 == "D") { deleted[$3]++ }
                   else if ($5 == "A") { added[$4]++ }
                 }
                 END {
                   shared = 0
                   for (blob in deleted) {
                     if (!(blob in added)) { continue }
                     if (blob == empty) { exit 1 }
                     if (deleted[blob] != 1 || added[blob] != 1) { exit 1 }
                     shared++
                   }
                   exit shared > 0 ? 0 : 1
                 }'; then
            rename_option=-M100%
          fi
          echo "the canonical diff binds renames with $rename_option"
          git -C "$GITHUB_WORKSPACE" \
            -c core.quotePath=false -c diff.suppressBlankEmpty=false \
            diff --no-color --no-ext-diff --no-textconv \
            "$rename_option" --full-index --binary --src-prefix=a/ --dst-prefix=b/ \
            --unified=3 --inter-hunk-context=0 --diff-algorithm=myers --indent-heuristic \
            --no-relative --submodule=short --ignore-submodules=none -O/dev/null \
            "$REVIEW_BASE" "$head_oid" > "$RUNNER_TEMP/material.diff"

          # The prompt names both endpoints, because the reviewer cannot see the record, and it
          # names review-findings' grammar, because the next step parses this body with it and
          # fails closed on a body that does not carry it. A prose review with no completion line
          # is refused as REVIEW_FINDINGS_INCOMPLETE, so an ordinary clean review would fail the
          # acceptance run for a reason that has nothing to do with the pool.
          #
          # Every optional value below must be a value review-findings accepts, not merely one a
          # reader would call reasonable. The line field is the trap: the parser defaults an absent
          # field to 0, but matches the value against \d+ when the field is present, so an empty
          # value is malformed while no field at all is fine. This prompt therefore asks for 0 and
          # never for an empty value. The parser maps 0 to no line, which is what a file-level
          # finding means. Check any new optional field against the parser the same way, and check
          # the prose rules too. The pattern at review-findings:28 is two alternatives, and both
          # were under-approximated by four successive wordings of the prompt's rule: it permits
          # whitespace between the word and its separator, and it also matches a bracketed prefix
          # followed by the word with no separator at all. The prompt therefore no longer tries to
          # name the refused shapes. It forbids the word outside a block header outright, which is
          # wider than the parser's test and cannot be under-approximated, since both alternatives
          # require the word to be present. Keep it that way: a narrower rule here has been wrong
          # four times, each time costing a round and reporting a correct review as unparseable.
          #
          # What such a refusal costs is worth stating exactly, because the obvious reading is
          # wrong. The backend is not reclassified. Its own outcome is copied from provider.json
          # unchanged, so the record still says it completed. What fails is the acceptance, at the
          # findings.json existence check below, whose message names the missing file. So a
          # backend that reviewed correctly fails the run, and the error points at a symptom two
          # steps from the cause.
          # The prompt shows the reviewer two literal example bodies rather than describing the
          # grammar, and this step checks both against the installed parser before it dispatches.
          # A description drifts from the parser silently, which it has now done three times on
          # this changeset. An example the parser accepted seconds earlier cannot. If the parser's
          # grammar moves, the check below fails this step with the parser's own message, so the
          # drift is loud and local instead of arriving later as a correct review refused.
          #
          # Two bodies, because they reach different paths: the clean one has no block at all and
          # still needs its completion line, and the one-finding one exercises the block. The
          # example's content is deliberately about a file this workflow does not touch, so a body
          # that echoes it is visible as an echo to anyone reading the record.
          example_clean="$(cat <<'EXAMPLE'
          I read the credential gating for every backend and both shellcheck file lists, and I report no defects.

          REVIEW_COMPLETE: findings=0
          EXAMPLE
          )"
          example_one="$(cat <<'EXAMPLE'
          I read the pool runner and its two callers, and I report one defect.

          [blocking] FINDING — The runner reaches the provider without its key
          file: internal/pool/runner.go
          line: 184
          category: logic-error
          issue: The third branch exports no key, so a run with that backend starts and then fails
            inside the provider rather than refusing at the gate, which reports a reviewing fault
            as a provider one.
          fix: Refuse at the gate when the key is absent, as the first branch does.

          REVIEW_COMPLETE: findings=1
          EXAMPLE
          )"
          # No --out: the check wants the exit code, not the parse, and --out opens its file with
          # mode x, so naming one would refuse on a second call in the same temp directory.
          check_example() {
            printf '%s\n' "$2" > "$RUNNER_TEMP/example-$1.md"
            if ! review-findings "$RUNNER_TEMP/example-$1.md" > /dev/null; then
              echo "::error::the prompt's $1 example is not a body review-findings accepts, so the" >&2
              echo "::error::prompt and the parser have drifted. Repair the example above." >&2
              exit 1
            fi
          }
          check_example clean "$example_clean"
          check_example one-finding "$example_one"

          prompt="$(cat <<PROMPT
          Review the diff supplied on standard input. It is the change from $REVIEW_BASE to
          $head_oid in this repository, and the files are on disk at that second revision.

          Report in at least one sentence what you checked, including when you find nothing.

          This is a complete body with one defect, and the form is exactly this:

          $example_one

          This is a complete body with no defects:

          $example_clean

          That content is illustrative and names a file this change does not touch. Report what
          you actually find, and never the example's defect.

          Use [blocking] for a defect, [wording] for a wording or documentation point and
          [citation] for a reference that does not hold. The file, issue and fix lines are
          required. The line and category lines are optional. A category must be one of nil-deref,
          unchecked-err, race, sql-injection, resource-leak, logic-error, standards-violation or
          other, and a file-level defect uses 0 for its line. Report no defect you cannot point
          at in the diff. Read files only.

          Four rules about what must not appear, which no example can show you.

          Never write the word FINDING anywhere except in a block header, in the position the form
          above puts it. Write "defect" instead, everywhere else, including in your opening
          sentence. A line outside a block header carrying that word is read as a malformed header
          and the whole body is then refused. This rule is deliberately wider than the parser's own
          test: four earlier versions of it tried to name the exact shapes that trip the parser,
          each named some and missed others, and a reviewer that obeyed any of them could still
          have its correct review refused. Avoiding the word entirely cannot be got wrong, because
          every shape the parser refuses here contains it.

          Wrap a long value only under issue or fix. A wrapped line under file, line or category
          is refused.

          Leave no blank line inside a block, because a blank line ends it.

          Write the completion line once, as the last line, and write no other line like it.
          PROMPT
          )"

          # The exit code is recorded and the job fails on it in the last step, so the record and
          # the artifact exist whatever the review did.
          set +e
          review-run \
            --backend "$REVIEW_BACKEND" \
            --root "$GITHUB_WORKSPACE" \
            --base "$REVIEW_BASE" \
            --sandbox "$REVIEW_SANDBOX" \
            --seconds 1500 \
            "${effort[@]}" \
            --out "$OUT_DIR" \
            "$prompt" < "$RUNNER_TEMP/material.diff"
          rc=$?
          set -e
          printf 'review_run_rc=%s\n' "$rc"
          printf 'rc=%s\n' "$rc" >> "$GITHUB_OUTPUT"

      - name: Extract the findings
        if: always()
        run: |
          set -euo pipefail
          # The default covers the case where the first step failed before it set the variable.
          OUT_DIR="${OUT_DIR:-$RUNNER_TEMP/acceptance/out}"
          # The material the reviewer read must be the range the record names. review-run hashes
          # the stdin bytes as input_sha256 and its own canonical diff of base..head as
          # material_sha256, so a disagreement means the diff options the review step copied have
          # drifted from the runner's own list. That is a failed acceptance run and not a note,
          # because every finding in the body would then be about bytes the record misdescribes.
          if [ -f "$OUT_DIR/provider.json" ]; then
            piped="$(jq -r '.identity.input_sha256 // "absent"' "$OUT_DIR/provider.json")"
            canonical="$(jq -r '.identity.material_sha256 // "absent"' "$OUT_DIR/provider.json")"
            # A digest the record does not carry is not a match. Both reads above fall back to the
            # same literal, so a record holding neither digest compared "absent" with "absent",
            # passed, and printed that the material matched: the one thing this check exists to
            # disprove. This run always passes --base, and review-run builds its identity block
            # before it constructs the record, so no writer on this path produces that record: the
            # guard is against a record malformed by any route, because a comparison with nothing in
            # it answers falsely whatever wrote it. Name the missing field, since a reader who sees
            # only a mismatch acts on two digests that disagree instead of one that is absent.
            missing=
            if [ "$piped" = absent ]; then
              missing="no stdin input_sha256"
            fi
            if [ "$canonical" = absent ]; then
              if [ -n "$missing" ]; then
                missing="$missing and no canonical material_sha256"
              else
                missing="no canonical material_sha256"
              fi
            fi
            if [ -n "$missing" ]; then
              echo "::error::the record names $missing, so the reviewed material cannot be checked against the recorded range." >&2
              exit 1
            fi
            if [ "$piped" != "$canonical" ]; then
              echo "::error::the reviewed material is not the recorded range." >&2
              echo "::error::stdin input_sha256 $piped, canonical material_sha256 $canonical" >&2
              exit 1
            fi
            echo "the reviewed material matches the recorded range: $canonical"
          fi

          if [ -f "$OUT_DIR/review.md" ]; then
            review-findings "$OUT_DIR/review.md" --out "$OUT_DIR/findings.json"
            echo "findings.json written"
          else
            echo "no review.md, so no findings.json: the review did not complete"
          fi

      - name: Write the acceptance record
        if: always()
        env:
          REVIEW_RUN_RC: ${{ steps.review.outputs.rc }}
        run: |
          set -euo pipefail
          # The defaults cover the case where the first step failed before it set the variables.
          RECORD_DIR="${RECORD_DIR:-$RUNNER_TEMP/acceptance}"
          OUT_DIR="${OUT_DIR:-$RECORD_DIR/out}"
          mkdir -p "$RECORD_DIR"
          outcome='unknown: provider.json is missing'
          if [ -f "$OUT_DIR/provider.json" ]; then
            # review-run writes `outcome`, never `status`. Selecting `status` emitted
            # "status":null for every valid record and dropped the completed, incomplete, quota
            # and launch-failed classification this record exists to carry.
            outcome="$(jq -c '{outcome, reason, backend, model, seconds}' "$OUT_DIR/provider.json" 2>&1 || true)"
          fi

          file_sha() {
            if [ -f "$1" ]; then
              sha256sum "$1" | cut -d' ' -f1
            else
              printf 'absent'
            fi
          }

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg backend "$REVIEW_BACKEND" \
            --arg sandbox "$REVIEW_SANDBOX" \
            --arg revision "${REVIEW_REVISION:-unknown}" \
            --arg base "${REVIEW_BASE:-unknown}" \
            --arg rc "${REVIEW_RUN_RC:-unknown}" \
            --arg bundle "${BUNDLE_RECORD_SHA256:-unknown}" \
            --arg digest "${REGISTRY_LATEST_DIGEST:-unknown}" \
            --arg namespaces "$(cat /proc/sys/user/max_user_namespaces)" \
            --arg review_md "$(file_sha "$OUT_DIR/review.md")" \
            --arg provider_json "$(file_sha "$OUT_DIR/provider.json")" \
            --arg findings_json "$(file_sha "$OUT_DIR/findings.json")" \
            --arg provider "$outcome" \
            '{repository: $repository, run_id: $run_id, backend: $backend, sandbox: $sandbox,
              revision: $revision, base: $base, review_run_rc: $rc,
              bundle_record_sha256: $bundle, registry_latest_digest: $digest,
              user_max_user_namespaces: $namespaces,
              files: {"review.md": $review_md, "provider.json": $provider_json,
                      "findings.json": $findings_json},
              provider: $provider}' \
            | tee "$RECORD_DIR/acceptance.json"

          {
            echo '## Review pool acceptance'
            echo
            echo '```json'
            cat "$RECORD_DIR/acceptance.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the record and the three result files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-pool-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/acceptance
          if-no-files-found: error
          retention-days: 14

      - name: Fail unless the review completed
        if: always()
        env:
          REVIEW_RUN_RC: ${{ steps.review.outputs.rc }}
        run: |
          set -euo pipefail
          # The default covers the case where the first step failed before it set the variable.
          OUT_DIR="${OUT_DIR:-$RUNNER_TEMP/acceptance/out}"
          if [ "${REVIEW_RUN_RC:-1}" != "0" ]; then
            echo "::error::review-run exited ${REVIEW_RUN_RC:-unknown}. Read provider.json in the artifact." >&2
            exit 1
          fi
          for name in review.md provider.json findings.json; do
            if [ ! -s "$OUT_DIR/$name" ]; then
              echo "::error::${name} is missing or empty, so the acceptance is not met." >&2
              exit 1
            fi
          done
          echo "the review completed and all three result files exist"
