# Automated PR review — reusable workflow.
# Caller must provide: on: pull_request trigger and pr_review_context input.
#
# Backend: claude-max-proxy (wende/claude-max-api-proxy), running as the
# standalone `claude-proxy` Deployment at
# http://claude-proxy.claude-proxy.svc:3456 — 2 replicas spread across nodes,
# liveness/readiness probes, prebuilt image, and a wrapper that bounds
# in-flight requests. It replaced a single-replica sidecar in the openclaw
# StatefulSet on 2026-08-21, where any openclaw restart dropped the only pod
# out of the Service and failed every CI review in the fleet with curl exit 7.
# The proxy exposes an OpenAI-compatible /v1/chat/completions endpoint.
# PR_REVIEW_MODEL / PR_REVIEW_ASSESS_MODEL select only the model family, not a
# version — and an unmapped name can silently change the family. See the defaults
# note below before editing either.
#
# Requires a self-hosted runner with in-cluster access to claude-max-proxy.
# No API key secrets needed — the proxy uses the host's Claude Max credentials.
#
# Findings become resolvable, merge-gating PR review threads (one per
# finding, deduped by fingerprint across reruns, auto-resolved when fixed or
# judged a false positive) via the pr-review-threads composite action — see
# .github/actions/pr-review-threads/action.yml and scripts/pr-review-threads.sh.
#
# PR_REVIEW_THREADS_MODE is set to "enforce" below (go-kure/.github#108),
# matching the org variable's own live value since 2026-08-18 — no mode is
# ever implicitly "enforce" anywhere else in this chain (the composite
# action's and the underlying script's own defaults both stay "advisory";
# an unrecognized mode string still degrades to "advisory", never
# "enforce" — see action.yml's `mode` input and
# scripts/pr-review-threads.sh:103-111). It's set explicitly, not left to
# fall through, because required_review_thread_resolution is ALREADY true
# org-wide (governance/repository-settings-policy.yaml), so an unresolved
# thread already blocks merge independent of this job's own required-check
# status.
#
# All three preconditions this rollout named are now met:
# (1) V1-V9 live-PR verification recorded, including the bot auto-resolve
#     path (docs/pr-review-threads-live-findings.md — V9 confirms full
#     production-path auto-resolve via KURE_BOT_PAT).
# (2) the `merge_group` trigger is wired into kure/launcher's own
#     pr-review-caller.yml.
# (3) `governance/repository-settings-policy.yaml`'s kure/launcher
#     `required_status_checks.contexts` now includes
#     `pr-review / AI Code Review` (go-kure/.github#108, same PR as this
#     comment update).
#
# Required-check scope: `pr-review / AI Code Review` is required on kure and
# launcher only, DELIBERATELY excluded from `.github` itself — not because
# the check can't run there, but because the reusable-workflow pin
# (`pr-review-caller.yml`'s `uses: ...pr-review.yml@main`) resolves the
# reviewer implementation from `main` at call time, not from the calling
# branch: the model still reads the branch's own diff (it is fed the PR's
# actual changes, including edits to the composite action itself — see
# scripts/lib/prt/model.sh) and can comment on them, but the reviewer code
# doing that reading, and every downstream reconciliation step, is always
# main's, never the branch's own — so the one thing this required check can
# never do is execute the specific implementation change it is nominally
# gating; requiring it would give a green check the same rubber-stamp
# weight as a genuinely-tested one, for the one class of PR whose own
# implementation change is never exercised. Full reasoning: docs/standards.md's
# "Same-repo composite actions and the
# pin-bump procedure".
#
# The job's `if:` no longer excludes drafts (2026-08-19) — this workflow was
# backported from GitLab's `meta/ci-templates/mr-review.yml`, which reviews
# every merge_request_event pipeline with no draft condition. The GitHub port
# carried a `draft == false` guard from the pre-centralisation per-repo copies
# with no recorded rationale (git blame: extraction commit 2f7c843, "full job
# condition retained"); it made "open as draft, converge, then undraft" a
# contradiction on this org, since the review that should inform convergence
# never ran until after undraft. Removed for parity with GitLab, where draft
# blocks merge, not review.
#
# continue-on-error was removed below once the failure surface was hardened
# (a per-call timeout on every GitHub/model curl call; a retry wrapper on the
# diff fetch, the PR-metadata read, and the marker-update PATCH calls —
# NOT on every GitHub write, e.g. posting a finding/reply comment or a
# resolve/unresolve GraphQL mutation is a single attempt; exit 1 on an
# incomplete review — see docs/pr-review-threads.md; model calls have a
# timeout but no retry wrapper) so a genuine problem now fails this job
# instead of silently reporting nothing. The incident escape hatch
# is the PR_REVIEW_THREADS_MODE=off org variable (docs/pr-review-threads.md,
# "Incident procedure"). It is checked twice: inside the script (short-circuits
# before any GitHub or model call) and, since a review finding on this same PR
# (a checkout or Setup-tools failure would otherwise be unrecoverable by the
# script-level check, since neither step has run yet), in the `pr-review` job's
# own `if:` below — `vars.PR_REVIEW_THREADS_MODE != 'off'` skips checkout, setup, AND
# the composite action entirely, so `off` now also covers a checkout failure,
# a Setup-tools apt-get failure, and an unresolvable action pin (see
# docs/standards.md's pin-bump procedure) — none of those can even start
# once the job itself is skipped.
#
# Defaults below (only actually overridable via a `vars.*` repository variable
# for PR_REVIEW_THREADS_MODE and CCPROXY_URL — see note above; every other one
# is env: only, so overriding it means editing this file, not setting a repo
# variable):
#   CCPROXY_URL                 (default: http://claude-proxy.claude-proxy.svc:3456;
#                                 vars.CCPROXY_URL overrides, resolved against the
#                                 caller's repository like PR_REVIEW_THREADS_MODE;
#                                 an empty variable keeps the default)
#   PR_REVIEW_MODEL             (default: claude-opus-5-5)
#   PR_REVIEW_MAX_DIFF_CHARS    (default: 50000)
#   PR_REVIEW_MAX_TOKENS        (default: 1500)
#   PR_REVIEW_ASSESS_MODEL      (default: claude-sonnet-4-6)
#   PR_REVIEW_ASSESS_MAX_TOKENS (default: 4096)
#   PR_REVIEW_AGENTS_FILE       (default: AGENTS.md)
#   PR_REVIEW_STANDARDS_FILE    (default: docs/standards.md; set from the
#                                 `standards-file` workflow_call input, ''
#                                 disables it; resolved against the checkout
#                                 PR_REVIEW_STANDARDS_SOURCE names — see
#                                 pr-review-threads.sh's PRT_SCRIPT_DIR note.
#                                 GitLab parity: mirrors
#                                 MR_REVIEW_STANDARDS_FILES in
#                                 ci-templates/mr-review.yml, which this port
#                                 lacked until now.)
#   PR_REVIEW_STANDARDS_SOURCE  (default: action; set from the
#                                 `standards-source` workflow_call input:
#                                 action is go-kure/.github's own checkout at
#                                 the pinned action SHA, caller the calling
#                                 repository's checkout)
#   PR_REVIEW_THREADS_MODE      (default: enforce; vars.PR_REVIEW_THREADS_MODE overrides — see note above)
#   PR_REVIEW_MAX_FINDINGS_TOTAL (default: 5)
#
# Review from the review pool (srgvg/claude-dotfiles#109). Two more `vars.*` repository variables,
# both off by default:
#   PR_REVIEW_BACKEND           (default: unset = the proxy, exactly as before; `file` takes the
#                                 review from a producer job on the review pool. Any other value
#                                 fails the job: an expression compares strings without regard to
#                                 case, so a typo must never read as the default)
#   PR_REVIEW_PRODUCER_BACKEND  (default: claude; the review-run --backend of the producer)
# With `file`, the `plan` job takes the base from the pull request, the `review-producer` job
# reviews the head, and this workflow's `pr-review` job downloads the three result files and posts
# from them. The assessment still goes to the proxy: the other two routes are refused in enforce mode.
# The first step of `pr-review` refuses to go on unless both new jobs succeeded: a job whose `needs`
# failed is skipped, and a skipped required check counts as passing.
#
# Both model names are sent as the request's `model` field, and the backend
# maps that name to a Claude Code CLI family alias — opus, sonnet or haiku —
# then spawns `claude --model <alias>`. Only the family is selectable, so the
# version suffix records which model was asked for and selects nothing; the
# alias and the pinned CLI decide which one answers. Two consequences:
#
#   - A name the backend's map does not hold falls back to `opus`, with no
#     validation and no error. PR_REVIEW_ASSESS_MODEL must therefore keep a
#     mapped name: `claude-sonnet-4-6` is mapped, and renaming it to an
#     unmapped form would silently promote the assessment pass to Opus.
#   - PR_REVIEW_MODEL's own `claude-opus-5-5` is itself unmapped at the pinned
#     backend, whose newest Opus entry is `claude-opus-4-6`. It reaches Opus
#     through that same fallback rather than through a map entry, which is
#     correct today and would break quietly if the backend ever changed its
#     default family. The durable fix is upstream: teach the backend's map the
#     5.x names. Until then, treat the `PR_REVIEW_MODEL` value in this job's env
#     block as intent, not as a binding.
#
#     Both claims about that map (that `claude-sonnet-4-6` is an entry, and that
#     a name the map does not hold falls back to `opus`) were read in the backend
#     adapter's own source on 2026-11-01. That source is not in this repository,
#     nothing here rechecks it, and it will go stale without anyone noticing.
#     Reread it before relying on either claim.
#
# The composite action and scripts/pr-review-threads.sh default to the same
# `claude-opus-5-5`, so a caller that omits or empties the `model` input, and a
# direct run of the script, are labelled as this job is. This job still passes the
# value explicitly below, so the pin it uses never decides its model.
#
# Bot identity (go-kure/.github#156): a caller without KURE_BOT_PAT passes its
# own PAT as the BOT_PAT secret and the login that PAT posts as as the
# `bot-login` input — both or neither; the first step fails the job on one
# without the other. Neither keeps the KURE_BOT_PAT / kure-bot behaviour below
# unchanged. Self-hosted runners still limit this workflow to callers in this
# org (docs/pr-review-threads.md, "Components"); a caller in another org uses
# the composite action from its own workflow, where the same identity inputs
# exist directly.

name: PR Review

on:
  workflow_call:
    inputs:
      pr_review_context:
        description: 'Project context injected into the review system prompt'
        type: string
        required: false
        default: ''
      bot-login:
        description: >-
          The login BOT_PAT posts as, REST spelling (a user login, or
          name[bot] for an App). Required with BOT_PAT, refused without it.
          Empty (default): kure-bot when KURE_BOT_PAT is set, else
          github-actions[bot].
        type: string
        required: false
        default: ''
      standards-file:
        description: >-
          Standards document injected as PROJECT STANDARDS, a path in the
          checkout standards-source names. Empty disables it.
        type: string
        required: false
        default: 'docs/standards.md'
      standards-source:
        description: >-
          Which checkout standards-file is read from: "action" (default),
          go-kure/.github at the pinned action SHA; "caller", the calling
          repository's own checkout. Any other value fails the review.
        type: string
        required: false
        default: 'action'
    secrets:
      BOT_PAT:
        description: >-
          A caller's own PAT for the review threads, used instead of
          KURE_BOT_PAT. Must belong to a user account (an App or GITHUB_TOKEN
          cannot resolve threads). Requires the bot-login input.
        required: false
      KURE_BOT_PAT:
        description: >-
          The go-kure kure-bot PAT (org secret, reaches kure, launcher and
          .github through `secrets: inherit`). Declared so the job's
          reference to it is a declared secret, not an undeclared one.
        required: false

concurrency:
  group: pr-review-threads-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # The base of the reviewed range, taken from the pull request and never from the producer's own
  # record: the guide says a record read against itself binds nothing. It is the merge base of the
  # pull request's base and head, which is what the diff the threads are built from shows.
  plan:
    name: Plan the pool review
    runs-on: autops-kube-kure
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.PR_REVIEW_THREADS_MODE != 'off' &&
      vars.PR_REVIEW_BACKEND == 'file'
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      base: ${{ steps.base.outputs.base }}
      empty: ${{ steps.base.outputs.empty }}
    steps:
      # `empty` is true when the pull request's net diff is nothing, for example after a push that
      # reverts every change. The review then has no material, so the producer is skipped and the
      # threads job takes its default path, which reconciles the old threads against zero findings.
      - name: Read the merge base of the pull request
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for cmd in curl jq; do
            command -v "$cmd" > /dev/null || { echo "::error title=pr-review plan::$cmd is not installed on this runner."; exit 1; }
          done
          compare=$(curl -fsS --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPO/compare/$BASE_SHA...$HEAD_SHA")
          base=$(jq -er '.merge_base_commit.sha' <<< "$compare")
          files=$(jq -er '.files | length' <<< "$compare")
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=pr-review plan::the compare API returned '$base', not a commit id."
            exit 1
          fi
          if ! [[ "$files" =~ ^[0-9]+$ ]]; then
            echo "::error title=pr-review plan::the compare API returned '$files' for the number of changed files."
            exit 1
          fi
          empty=false
          if [ "$files" = 0 ]; then
            empty=true
          fi
          echo "merge base of $BASE_SHA and $HEAD_SHA is $base; $files changed file(s); empty=$empty"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "empty=$empty" >> "$GITHUB_OUTPUT"

  # The review itself, on the review pool, by the callable acceptance workflow. It holds the backend
  # credential and no sandbox, so it reviews only code this repository carries (its own reachability
  # guard refuses a fork head), and this job is skipped for a fork pull request as well. Called at
  # main like pr-review-caller.yml calls this file, so there is no second pin to keep.
  review-producer:
    name: Review on the review pool
    needs: plan
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.PR_REVIEW_THREADS_MODE != 'off' &&
      vars.PR_REVIEW_BACKEND == 'file' &&
      needs.plan.outputs.empty != 'true'
    permissions:
      contents: read
    uses: go-kure/.github/.github/workflows/review-pool-acceptance.yml@main
    with:
      backend: ${{ vars.PR_REVIEW_PRODUCER_BACKEND || 'claude' }}
      revision: ${{ github.event.pull_request.head.sha }}
      base: ${{ needs.plan.outputs.base }}
      # The same three inputs the proxy review reads, so the pool review is told what it is told.
      context: ${{ inputs.pr_review_context }}
      standards_file: ${{ inputs.standards-file }}
      standards_source: ${{ inputs.standards-source }}
    secrets: inherit

  pr-review:
    name: AI Code Review
    runs-on: autops-kube-kure
    # `!cancelled()` so this job runs after a producer that failed: without it the job is skipped,
    # and a skipped required check counts as passing. The first step is what then refuses.
    needs: [plan, review-producer]
    if: >-
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.PR_REVIEW_THREADS_MODE != 'off'
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    env:
      # Variable name is historical — it has not pointed at ccproxy for a long
      # time, and renaming it would break every caller that overrides it.
      CCPROXY_URL: "http://claude-proxy.claude-proxy.svc:3456"
      # Selects the Opus family only, and through the backend's fallback rather
      # than a map entry. See the defaults note in the file header before editing.
      PR_REVIEW_MODEL: "claude-opus-5-5"
      PR_REVIEW_MAX_DIFF_CHARS: "50000"
      PR_REVIEW_MAX_TOKENS: "1500"
      PR_REVIEW_CONTEXT: ${{ inputs.pr_review_context }}
      PR_REVIEW_ASSESS_MODEL: "claude-sonnet-4-6"
      PR_REVIEW_ASSESS_MAX_TOKENS: "4096"
      PR_REVIEW_AGENTS_FILE: "AGENTS.md"
      PR_REVIEW_STANDARDS_FILE: ${{ inputs.standards-file }}
      PR_REVIEW_STANDARDS_SOURCE: ${{ inputs.standards-source }}
      PR_REVIEW_THREADS_MODE: "enforce"
      PR_REVIEW_MAX_FINDINGS_TOTAL: "5"

    steps:
      # The gate for the pool path, and the first step on purpose: nothing below it runs on a review
      # that was asked for and not delivered. With the switch unset, plan and review-producer are
      # both skipped and this passes. With it `file`, both must have succeeded, except for a net diff
      # of nothing, where the plan job succeeded and the producer was skipped on purpose. Any other
      # value is refused, because the jobs above compare it without regard to case and the shell
      # does not.
      - name: Refuse to continue when the review producer did not succeed
        env:
          BACKEND: ${{ vars.PR_REVIEW_BACKEND }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PRODUCER_RESULT: ${{ needs.review-producer.result }}
          EMPTY: ${{ needs.plan.outputs.empty }}
        run: |
          case "$BACKEND" in
            file)
              want=success
              if [ "$EMPTY" = true ]; then
                want=skipped
              elif [ "$EMPTY" != false ]; then
                echo "::error title=pr-review producer::PR_REVIEW_BACKEND is file, but the plan job did not say whether the net diff is empty (it said '$EMPTY'; plan ended '$PLAN_RESULT')."
                exit 1
              fi
              if [ "$PLAN_RESULT" != success ] || [ "$PRODUCER_RESULT" != "$want" ]; then
                echo "::error title=pr-review producer::PR_REVIEW_BACKEND is file, but plan ended '$PLAN_RESULT' and review-producer ended '$PRODUCER_RESULT' (wanted '$want', net diff empty: $EMPTY). The review was asked for and not delivered, so this check fails rather than passing unreviewed."
                exit 1
              fi
              ;;
            '')
              if [ "$PLAN_RESULT" != skipped ] || [ "$PRODUCER_RESULT" != skipped ]; then
                echo "::error title=pr-review producer::PR_REVIEW_BACKEND is unset, but plan ended '$PLAN_RESULT' and review-producer ended '$PRODUCER_RESULT'. Refusing a state that cannot happen."
                exit 1
              fi
              ;;
            *)
              echo "::error title=pr-review producer::PR_REVIEW_BACKEND is '$BACKEND'. It must be unset or exactly 'file'."
              exit 1
              ;;
          esac

      # go-kure/.github#156: a PAT whose login is unknown cannot own the
      # threads it opens (ownership needs marker AND author == bot-login), and
      # a bot-login without its PAT names an account the token does not post
      # as. Either half alone would open threads this job never owns, so never
      # resolves; refuse it before anything else runs. The secret only reaches
      # this step as a true/false string: secrets are not allowed in a step
      # `if:`, and the value itself is never needed here.
      - name: Check bot identity inputs
        env:
          BOT_PAT_SET: ${{ secrets.BOT_PAT != '' }}
          BOT_LOGIN: ${{ inputs.bot-login }}
        run: |
          if [ "$BOT_PAT_SET" = true ] && [ -z "$BOT_LOGIN" ]; then
            echo "::error title=pr-review bot identity::BOT_PAT is set but the bot-login input is empty; pass the login BOT_PAT posts as, or its threads are never owned and never resolved."
            exit 1
          fi
          if [ "$BOT_PAT_SET" != true ] && [ -n "$BOT_LOGIN" ]; then
            echo "::error title=pr-review bot identity::the bot-login input is set but the BOT_PAT secret is not; pass both, or neither to keep the default identity."
            exit 1
          fi

      # The head this job attributes its results to (`head-sha` below), not the
      # temporary merge commit a pull_request event checks out by default, and
      # the full history, so a later step can compute a merge base. The job
      # only runs for same-repository PRs (the `if:` above), so this fetches no
      # fork code. The diff itself still comes from the GitHub API.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # The review reads files and calls the API with the github-token input; it
          # never pushes, so no token should sit in .git/config where a runner
          # started under this checkout could read it.
          persist-credentials: false

      # The review reads this tree and reports against `head-sha`, so fail the job
      # unless HEAD is that commit and the tree is clean. The status is read into a
      # variable first: inside `test -z "$(...)"` a failing `git status` prints
      # nothing and would pass as a clean tree.
      - name: Assert the checkout is the pull request head and clean
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "::error title=pr-review checkout::HEAD is $head, not the pull request head $HEAD_SHA."
            exit 1
          fi
          status=$(git status --porcelain --untracked-files=all)
          if [ -n "$status" ]; then
            echo "::error title=pr-review checkout::the working tree is not clean after checkout."
            printf '%s\n' "$status"
            exit 1
          fi
          echo "checkout is $head, working tree clean"

      - name: Setup tools
        run: |
          for cmd in curl jq; do
            if ! command -v "$cmd" &>/dev/null; then
              if command -v sudo &>/dev/null; then
                sudo apt-get update -qq && sudo apt-get install -y -qq curl jq
              else
                apt-get update -qq && apt-get install -y -qq curl jq
              fi
              break
            fi
          done

      # The pool path only: fetch what the producer wrote and name it to the action. Nothing here runs
      # with the switch unset, so the default path's environment is exactly what it was.
      - name: Download the producer's result files
        if: vars.PR_REVIEW_BACKEND == 'file' && needs.plan.outputs.empty != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.review-producer.outputs.artifact }}
          path: ${{ runner.temp }}/review-artifact

      # The action reads PRT_REVIEW_BACKEND, PRT_FINDINGS_FILE, PRT_REVIEW_BASE_SHA and
      # PRT_REVIEW_MATERIAL_SHA256 from its calling step's environment, so they are set for the job.
      # The base is the plan job's, taken from the pull request. The digest is recomputed here from
      # this checkout with the flags the guide names, never copied from provider.json: a value copied
      # out of the record would make the importer's comparison read the record against itself.
      - name: Name the findings file and the identity it must carry
        if: vars.PR_REVIEW_BACKEND == 'file' && needs.plan.outputs.empty != 'true'
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/review-artifact
          BASE_SHA: ${{ needs.plan.outputs.base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          out="$ARTIFACT_DIR/out"
          for name in review.md provider.json findings.json; do
            if [ ! -s "$out/$name" ]; then
              echo "::error title=pr-review producer::$out/$name is missing or empty."
              exit 1
            fi
          done
          # Written to a file first and tested for content: the sha256 of an empty stream is a valid
          # looking digest, and a failed git inside a pipe would otherwise leave exactly that.
          diff_file="$RUNNER_TEMP/material.diff"
          git -c core.quotePath=false -c diff.suppressBlankEmpty=false diff \
            --no-color --no-ext-diff --no-textconv --no-renames --full-index --binary \
            --src-prefix=a/ --dst-prefix=b/ --unified=3 --inter-hunk-context=0 \
            --diff-algorithm=myers --indent-heuristic --no-relative --submodule=short \
            --ignore-submodules=none -O/dev/null "$BASE_SHA" "$HEAD_SHA" -- > "$diff_file"
          if [ ! -s "$diff_file" ]; then
            echo "::error title=pr-review producer::the canonical diff of $BASE_SHA..$HEAD_SHA is empty, so no digest can stand for it."
            exit 1
          fi
          digest=$(sha256sum "$diff_file")
          digest="${digest%% *}"
          if ! [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error title=pr-review producer::the material digest '$digest' is not a sha256."
            exit 1
          fi
          {
            echo "PRT_REVIEW_BACKEND=file"
            echo "PRT_FINDINGS_FILE=$out/findings.json"
            echo "PRT_REVIEW_BASE_SHA=$BASE_SHA"
            echo "PRT_REVIEW_MATERIAL_SHA256=$digest"
          } >> "$GITHUB_ENV"
          echo "findings file $out/findings.json; base $BASE_SHA; material digest $digest"

      - name: Run PR review threads
        uses: go-kure/.github/.github/actions/pr-review-threads@a30a3a7abc3cf2256d588918c4ae095ac8ca7152 # placeholder pending the final re-pin to the merge of go-kure/.github#429, which also covers go-kure/.github#296, go-kure/.github#306, go-kure/.github#372 and go-kure/.github#109 — base-ref tip, see docs/standards.md "GitHub Actions pinning"
        with:
          # github-token / bot-login: GITHUB_TOKEN always gets viewerCanResolve:false
          # on threads it authors (GitHub rejects bot/App actors for
          # resolveReviewThread categorically, regardless of granted scope — see
          # go-kure/.github#68 and docs/pr-review-threads-live-findings.md V6/V7).
          # KURE_BOT_PAT is a fine-grained PAT owned by the kure-bot machine-user
          # account, which resolves its own threads fine (human-owned actor). It's
          # an org secret (visibility: .github, kure, launcher) reaching this job
          # via pr-review-caller.yml's `secrets: inherit`; falls back to
          # github.token/github-actions[bot] in any repo where it isn't set, so
          # this degrades to today's create-only behavior rather than failing.
          # A caller's own BOT_PAT + bot-login pair (go-kure/.github#156, the
          # first step checks they come together) takes precedence over both.
          github-token: ${{ secrets.BOT_PAT || secrets.KURE_BOT_PAT || github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          mode: ${{ vars.PR_REVIEW_THREADS_MODE || env.PR_REVIEW_THREADS_MODE }}
          proxy-url: ${{ vars.CCPROXY_URL || env.CCPROXY_URL }}
          bot-login: ${{ inputs.bot-login != '' && inputs.bot-login || (secrets.KURE_BOT_PAT != '' && 'kure-bot' || 'github-actions[bot]') }}
          model: ${{ env.PR_REVIEW_MODEL }}
          max-tokens: ${{ env.PR_REVIEW_MAX_TOKENS }}
          assess-model: ${{ env.PR_REVIEW_ASSESS_MODEL }}
          assess-max-tokens: ${{ env.PR_REVIEW_ASSESS_MAX_TOKENS }}
          max-diff-chars: ${{ env.PR_REVIEW_MAX_DIFF_CHARS }}
          max-findings-total: ${{ env.PR_REVIEW_MAX_FINDINGS_TOTAL }}
          project-context: ${{ env.PR_REVIEW_CONTEXT }}
          agents-file: ${{ env.PR_REVIEW_AGENTS_FILE }}
          standards-file: ${{ env.PR_REVIEW_STANDARDS_FILE }}
          standards-source: ${{ env.PR_REVIEW_STANDARDS_SOURCE }}
