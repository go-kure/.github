# Automated PR review — reusable workflow.
# Caller must provide: on: pull_request trigger and pr_review_context input.
#
# Backend: claude-max-proxy (wende/claude-max-api-proxy) sidecar of the
# openclaw StatefulSet, at http://openclaw-claude-proxy.openclaw.svc:3456.
# The proxy exposes an OpenAI-compatible /v1/chat/completions endpoint.
# PR_REVIEW_MODEL / PR_REVIEW_ASSESS_MODEL are cosmetic labels only.
#
# Requires a self-hosted runner with in-cluster access to claude-max-proxy.
# No API key secrets needed — the proxy uses the host's Claude Max credentials.
#
# Findings become resolvable, merge-gating PR review threads (one per
# finding, deduped by fingerprint across reruns, auto-resolved when fixed or
# judged a false positive) via the pr-review-threads composite action — see
# .github/actions/pr-review-threads/action.yml and scripts/pr-review-threads.sh.
#
# PR_REVIEW_THREADS_MODE is set to "advisory" below (matching the composite
# action's and the underlying script's own default — no mode is ever
# implicitly "enforce" anywhere in this chain). It's set explicitly, not
# left to fall through, because required_review_thread_resolution is
# ALREADY true org-wide (governance/repository-settings-policy.yaml), so an
# unresolved thread already blocks merge today, independent of the
# still-open Gating-section work (making this job itself a required check,
# to close the auto-merge timing race). Flipping the default below to
# "enforce" is a deliberate later step, only after: (1) V1-V7 live-PR
# verification (see the design plan and docs/pr-review-threads-live-findings.md)
# is recorded — V1 confirmed 2026-08-18: the required-check context string is
# byte-identical on merge_group as on pull_request, and reports skipped (not
# missing) on the queue's temporary ref; the draft/fork if: below needed no
# change for this to hold, (2) the merge_group trigger lands in kure/launcher
# (done, Task 3), (3) the required_status_checks.contexts policy change lands.
# Until then, advisory mode is intentionally the only wired path (still posts
# one plain issue comment with the merged findings table, matching
# pre-existing behavior).
#
# continue-on-error was removed below once the failure surface was hardened
# (retries + timeouts on every GitHub/model call, exit 1 on an incomplete
# review — see docs/pr-review-threads.md) so a genuine problem now fails this
# job instead of silently reporting nothing. The incident escape hatch is the
# PR_REVIEW_THREADS_MODE=off org variable (docs/pr-review-threads.md,
# "Incident procedure") — it short-circuits before any GitHub or model call,
# so it restores merges even during an active failure here.
#
# Defaults below (only actually overridable via a `vars.*` repository variable
# for PR_REVIEW_THREADS_MODE — see note above; every other one is env: only,
# so overriding it means editing this file, not setting a repo variable):
#   PR_REVIEW_MODEL             (default: claude-opus-4)
#   PR_REVIEW_MAX_DIFF_CHARS    (default: 50000)
#   PR_REVIEW_MAX_TOKENS        (default: 1500)
#   PR_REVIEW_ASSESS_MODEL      (default: claude-sonnet-4-6)
#   PR_REVIEW_ASSESS_MAX_TOKENS (default: 4096)
#   PR_REVIEW_AGENTS_FILE       (default: AGENTS.md)
#   PR_REVIEW_THREADS_MODE      (default: advisory; vars.PR_REVIEW_THREADS_MODE overrides — see note above)
#   PR_REVIEW_MAX_FINDINGS_TOTAL (default: 5)

name: PR Review

on:
  workflow_call:
    inputs:
      pr_review_context:
        description: 'Project context injected into the review system prompt'
        type: string
        required: false
        default: ''

concurrency:
  group: pr-review-threads-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  pr-review:
    name: AI Code Review
    runs-on: autops-kube-kure
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    env:
      CCPROXY_URL: "http://openclaw-claude-proxy.openclaw.svc:3456"
      PR_REVIEW_MODEL: "claude-opus-4"
      PR_REVIEW_MAX_DIFF_CHARS: "50000"
      PR_REVIEW_MAX_TOKENS: "1500"
      PR_REVIEW_CONTEXT: ${{ inputs.pr_review_context }}
      PR_REVIEW_ASSESS_MODEL: "claude-sonnet-4-6"
      PR_REVIEW_ASSESS_MAX_TOKENS: "4096"
      PR_REVIEW_AGENTS_FILE: "AGENTS.md"
      PR_REVIEW_THREADS_MODE: "advisory"
      PR_REVIEW_MAX_FINDINGS_TOTAL: "5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup tools
        run: |
          for cmd in curl jq; do
            if ! command -v "$cmd" &>/dev/null; then
              if command -v sudo &>/dev/null; then
                sudo apt-get update -qq && sudo apt-get install -y -qq curl jq
              else
                apt-get update -qq && apt-get install -y -qq curl jq
              fi
              break
            fi
          done

      - name: Run PR review threads
        uses: go-kure/.github/.github/actions/pr-review-threads@03492df05ffc13e4d46e8740d19baa724d5b58e1 # main
        with:
          github-token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          mode: ${{ vars.PR_REVIEW_THREADS_MODE || env.PR_REVIEW_THREADS_MODE }}
          proxy-url: ${{ env.CCPROXY_URL }}
          bot-login: "github-actions[bot]"
          model: ${{ env.PR_REVIEW_MODEL }}
          max-tokens: ${{ env.PR_REVIEW_MAX_TOKENS }}
          assess-model: ${{ env.PR_REVIEW_ASSESS_MODEL }}
          assess-max-tokens: ${{ env.PR_REVIEW_ASSESS_MAX_TOKENS }}
          max-diff-chars: ${{ env.PR_REVIEW_MAX_DIFF_CHARS }}
          max-findings-total: ${{ env.PR_REVIEW_MAX_FINDINGS_TOTAL }}
          project-context: ${{ env.PR_REVIEW_CONTEXT }}
          agents-file: ${{ env.PR_REVIEW_AGENTS_FILE }}
