name: Org Settings

on:
  push:
    branches: [main]
    paths:
      - 'governance/**'
      - 'standards/**'
  schedule:
    - cron: '0 6 * * *'  # Daily 6am UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: audit (dry-run, fails on issues) or apply (make changes)"
        default: audit
        required: true
        type: choice
        options:
          - audit
          - apply
      repo:
        description: >-
          Repository name, 'all', or 'org' for organization-level settings.
          'org' only takes effect on a manual run — push/schedule always
          default to 'all' and never audit org-level settings. --org also
          needs a token with the admin:org scope; whether secrets.SETTINGS_PAT
          carries it is unverified as of when --org was added.
        default: all
        required: false

jobs:
  settings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read yq version from mise.toml
        id: yq-version
        run: |
          VER=$(grep '^yq = ' mise.toml | sed 's/yq = "\(.*\)"/\1/')
          if [ -z "$VER" ]; then
            echo "::error::Failed to parse yq version from mise.toml"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Install yq
        env:
          YQ_VERSION: ${{ steps.yq-version.outputs.version }}
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Run settings
        env:
          GH_TOKEN: ${{ secrets.SETTINGS_PAT }}
          INPUT_MODE: ${{ inputs.mode || 'audit' }}
          INPUT_REPO: ${{ inputs.repo || 'all' }}
        run: |
          set -o pipefail
          FLAGS="--ci --json"
          [ "$INPUT_MODE" = "apply" ] && FLAGS="$FLAGS --apply"
          if [ "$INPUT_REPO" = "org" ]; then
            # Manual dispatch only (repo: org input) — push/schedule always
            # resolve INPUT_REPO to 'all' above and never reach this branch.
            bash scripts/github-settings.sh --org $FLAGS 2>&1 | tee settings-output.txt
          elif [ "$INPUT_REPO" = "all" ]; then
            bash scripts/github-settings.sh --all $FLAGS 2>&1 | tee settings-output.txt
          else
            bash scripts/github-settings.sh "$INPUT_REPO" $FLAGS 2>&1 | tee settings-output.txt
          fi

      - name: Post summary
        if: always()
        env:
          INPUT_MODE: ${{ inputs.mode || 'audit' }}
        run: |
          [ -f github-settings-report.json ] || exit 0
          {
            echo "## Org Settings — ${INPUT_MODE}"
            echo ""
            python3 - <<'EOF'
          import json
          with open("github-settings-report.json") as f:
              d = json.load(f)
          org = d.get("org")
          if org:
              status = "OK" if org.get("settings_missing", 0) == 0 else f"**{org['settings_missing']} issues**"
              print(f"Organization settings: {org.get('settings_ok', 0)} ok, {org.get('settings_missing', 0)} wrong — {status}")
          else:
              print("| Repo | Labels | Settings | Rulesets | Status |")
              print("|------|--------|----------|----------|--------|")
              for r in d.get("repos", []):
                  issues = r["labels_missing"] + r["labels_renamed"] + r.get("labels_extra", 0) + r.get("labels_duplicate", 0) + r.get("labels_drift", 0) + r["settings_missing"] + r["rulesets_missing"]
                  status = "OK" if issues == 0 else f"**{issues} issues**"
                  lbl = f"{r['labels_ok']} ok"
                  if r["labels_missing"]: lbl += f", **{r['labels_missing']} missing**"
                  if r["labels_renamed"]: lbl += f", **{r['labels_renamed']} to rename**"
                  if r.get("labels_extra", 0): lbl += f", **{r['labels_extra']} extra**"
                  if r.get("labels_duplicate", 0): lbl += f", **{r['labels_duplicate']} duplicate**"
                  if r.get("labels_drift", 0): lbl += f", **{r['labels_drift']} metadata drift**"
                  sett = f"{r['settings_ok']} ok"
                  if r["settings_missing"]: sett += f", **{r['settings_missing']} wrong**"
                  rs = f"{r['rulesets_ok']} ok"
                  if r["rulesets_missing"]: rs += f", **{r['rulesets_missing']} wrong**"
                  print(f"| `{r['repo']}` | {lbl} | {sett} | {rs} | {status} |")
          EOF
            if grep -qE 'MISSING|WRONG|LEGACY|RENAME|EXTRA|SKIP|CREATING|RENAMING|SETTING|UPDATING|DELETING|UNMANAGED|BLOCKED|DUPLICATE' settings-output.txt 2>/dev/null; then
              echo ""
              echo "## Changes"
              echo '```'
              grep -E 'Repository:|Organization:|MISSING|WRONG|LEGACY|RENAME|EXTRA|SKIP|CREATING|RENAMING|SETTING|UPDATING|DELETING|BLOCKED|UNMANAGED|DUPLICATE' settings-output.txt
              echo '```'
            fi
            echo ""
            echo "_Generated: $(date -u '+%Y-%m-%d %H:%M UTC')_"
          } >> $GITHUB_STEP_SUMMARY

  # Independent of `settings` above: settings drift and PR/CI health are
  # different failure classes, and a red run here shouldn't need the other
  # job to also be red (or vice versa) to be visible — either job failing
  # already fails the overall workflow run, which is the notification.
  # See docs/standards.md, "PR CI Health" for what this does and does not
  # cover.
  pr-ci-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check open-PR CI health across org repos
        env:
          GH_TOKEN: ${{ secrets.SETTINGS_PAT }}
        run: |
          set -o pipefail
          bash scripts/pr-ci-health.sh --ci --json 2>&1 | tee pr-ci-health-output.txt

      - name: Post summary
        if: always()
        run: |
          [ -f pr-ci-health-report.json ] || exit 0
          {
            echo "## PR CI Health"
            echo ""
            python3 - <<'EOF'
          import json
          with open("pr-ci-health-report.json") as f:
              failing = json.load(f)
          if not failing:
              print("All open, non-draft PRs green (or none open).")
          else:
              print(f"**{len(failing)} open PR(s) with failing/erroring checks:**")
              print()
              print("| Repo | PR | State | Title |")
              print("|------|----|-------|-------|")
              for p in failing:
                  # PR titles are attacker-controllable (any external contributor sets one) and
                  # land verbatim in a table cell — an unescaped `|` splits into extra columns
                  # and corrupts the rendered table (go-kure/.github#141 review finding).
                  title = p['title'].replace('|', '\\|')
                  print(f"| `{p['repo']}` | [#{p['number']}]({p['url']}) | {p['state']} | {title} |")
          EOF
            if grep -qE 'WARNING:|ERROR:' pr-ci-health-output.txt 2>/dev/null; then
              echo ""
              echo "## Warnings / Errors"
              echo '```'
              grep -E 'WARNING:|ERROR:' pr-ci-health-output.txt
              echo '```'
            fi
            echo ""
            echo "_Generated: $(date -u '+%Y-%m-%d %H:%M UTC')_"
          } >> $GITHUB_STEP_SUMMARY
