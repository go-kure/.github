name: PR Review Runner Boundary Probe

# Acceptance run for the runner's process boundary (docs/pr-review-threads.md,
# "Process boundary"). Manual only: it runs on the review pool, and its result applies to
# that pool only (the review job itself still runs on the general CI pool).
# It holds no secret and calls no model: a made-up canary stands in for the posting
# token and a stub for the runner. A red run is a result, not a flake.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe
    # The review pool, not the general CI pool: only the review pool's nodes allow the user
    # namespaces the boundary needs, so a run elsewhere would report nothing about it.
    runs-on: autops-kube-review
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Positive isolation cases of the suite
        env:
          PRT_TEST_REQUIRE_NAMESPACE: "1"
        run: bash scripts/test/pr-review-threads-test.sh .

      # The probe's own full-run cases need the same namespace. Without the switch they skip
      # on a lane that forbids it, and nothing would fail.
      - name: Probe fixture suite, full-run cases required
        if: ${{ !cancelled() }}
        env:
          PRT_TEST_REQUIRE_NAMESPACE: "1"
        run: bash scripts/test/pr-review-runner-boundary-probe-test.sh .

      # Runs after a failed suite step too: a lane without user namespaces fails the suites, and
      # that is the case whose diagnostics and "not established" result this step exists to give.
      # A failed suite step still fails the job; only a cancel skips this step.
      - name: Canary probe behind the default boundary
        if: ${{ !cancelled() }}
        run: bash scripts/pr-review-runner-boundary-probe.sh
