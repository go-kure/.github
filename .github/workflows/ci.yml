name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rebase-check:
    name: rebase-check
    runs-on: autops-kube-kure
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check branch is rebased on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::Branch is not rebased on latest main. Please run: git rebase origin/main"
            exit 1
          fi
          echo "Branch is up to date with main."

  lint:
    name: lint
    runs-on: autops-kube-kure
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.7'
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint
      - name: Lint workflows
        run: actionlint

  test:
    name: test
    runs-on: autops-kube-kure
    timeout-minutes: 5
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: No-op
        run: echo "No tests for a workflow library — actionlint in lint covers syntax validation."

  link-check:
    name: link-check
    runs-on: autops-kube-kure
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install lychee
        env:
          LYCHEE_VERSION: '0.24.2'
        run: |
          curl -fsSL -o /tmp/lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/lychee.tar.gz -C /tmp
          sudo install -m755 "$(find /tmp -type f -name lychee | head -1)" /usr/local/bin/lychee
      - name: Check internal links
        run: lychee --offline --no-progress './**/*.md'

  forbidden-terms:
    name: forbidden-terms
    runs-on: autops-kube-kure
    timeout-minutes: 2
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check for downstream references
        uses: ./.github/actions/check-forbidden-terms

  # Nothing else in this repo shellchecks or executes the doc-sync scripts —
  # `test` above is a deliberate no-op. Consumer repos now reach these scripts
  # only through the composite actions in .github/actions/, so a break here
  # would otherwise surface first as a consumer-repo CI failure. Real
  # invocations, not dry-runs: neither check-doc-sync.sh nor check-doc-gate.sh
  # has a dry-run mode, and check-doc-gate.sh's --skip=true exits 0 without
  # checking anything, so it doesn't count as one.
  scripts-smoke-test:
    name: scripts-smoke-test
    runs-on: autops-kube-kure
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2 # check-doc-gate.sh below diffs against HEAD~1
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: '0.10.0'
        run: |
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m755 "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
      - name: shellcheck
        run: shellcheck scripts/check-doc-sync.sh scripts/check-doc-gate.sh scripts/check-links.sh scripts/exact-array-member.sh scripts/check-workflow-refs.sh scripts/github-settings.sh scripts/check-settings-doc.sh scripts/check-action-pins.sh
      - name: Install yq
        env:
          YQ_VERSION: '4.44.6'
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
      - name: check-doc-sync.sh against this repo's own docs-map.yaml
        run: bash scripts/check-doc-sync.sh .
      - name: check-doc-gate.sh against the previous commit
        run: bash scripts/check-doc-gate.sh "$(git rev-parse HEAD~1)" .
      - name: check-workflow-refs.sh against AGENTS.md / docs/standards.md
        run: bash scripts/check-workflow-refs.sh .
      - name: check-action-pins.sh test suite
        run: bash scripts/test/check-action-pins-test.sh .
      - name: check-action-pins.sh against this repo
        run: bash scripts/check-action-pins.sh .
      - name: check-settings-doc.sh against governance policy
        run: bash scripts/check-settings-doc.sh .
      - name: github-settings.sh mock-gh test suite
        run: bash scripts/test/github-settings-test.sh .
      - name: Install lychee
        env:
          LYCHEE_VERSION: '0.24.2'
        run: |
          curl -fsSL -o /tmp/lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/lychee.tar.gz -C /tmp
          sudo install -m755 "$(find /tmp -type f -name lychee | head -1)" /usr/local/bin/lychee
      - name: check-links.sh against a minimal HTML fixture
        run: |
          mkdir -p /tmp/link-fixture
          printf '<html><body><a href="/about.html">about</a></body></html>' > /tmp/link-fixture/index.html
          printf '<html><body>hello</body></html>' > /tmp/link-fixture/about.html
          bash scripts/check-links.sh /tmp/link-fixture

  build:
    name: build
    runs-on: autops-kube-kure
    timeout-minutes: 1
    needs: [lint, test, link-check, forbidden-terms, scripts-smoke-test]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.link-check.result }}" != "success" ] || [ "${{ needs.forbidden-terms.result }}" != "success" ] || [ "${{ needs.scripts-smoke-test.result }}" != "success" ]; then
            echo "::error::lint, test, link-check, forbidden-terms, or scripts-smoke-test failed"
            exit 1
          fi
          echo "All checks passed."
