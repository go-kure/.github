name: Auto-Rebase

on:
  workflow_call:

concurrency:
  group: auto-rebase
  cancel-in-progress: true

jobs:
  auto-rebase:
    name: auto-rebase
    runs-on: autops-kube-kure
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Rebase open PRs
        uses: peter-evans/rebase@e4945786f7ca41fe6e101cead4395f5489593943 # v4
        with:
          token: ${{ secrets.AUTO_REBASE_PAT }}
          base: main
          exclude-labels: dependencies
          # Drafts are rebased too (GitLab auto-rebase.yml parity — that template ranks
          # non-drafts ahead of drafts but never excludes them; exclude-drafts: true here had
          # no recorded rationale, just the 2026-04-21 initial-workflow default).
