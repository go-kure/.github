name: Auto-Rebase

on:
  workflow_call:

concurrency:
  group: auto-rebase
  cancel-in-progress: true

jobs:
  auto-rebase:
    name: auto-rebase
    runs-on: autops-kube-kure
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Rebase open PRs
        uses: peter-evans/rebase@d6f70ba4beda4faa44e582a974ec3b7b40713951 # v4
        with:
          token: ${{ secrets.AUTO_REBASE_PAT }}
          base: main
          # Opt-in (go-kure/.github#396): only a PR carrying this label is rebased. Rewriting every
          # open PR on each push to main voided the head-bound reviews of PRs that were not
          # about to merge. Add the label to the PR that is: gh pr edit <n> --add-label auto-rebase
          include-labels: auto-rebase
          exclude-labels: dependencies
          # No exclude-drafts: a labelled draft is rebased too, because the label is the request.
          # This is not a parity rule: the GitLab auto-rebase template lists non-draft MRs only,
          # and no check compares the two forges.
