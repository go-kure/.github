# GitHub repository settings for go-kure organization
# Applied by scripts/github-settings.sh

github_defaults:
  allow_rebase_merge: true
  allow_squash_merge: false
  allow_merge_commit: false
  delete_branch_on_merge: true
  allow_update_branch: true
  has_wiki: false
  allow_auto_merge: true
  has_projects: true
  has_issues: true
  has_discussions: false
  has_downloads: false
  is_template: false
  allow_forking: true
  # May read back true regardless of this value if the org forces commit
  # signoff — GitHub's org-level setting overrides the repo-level one.
  web_commit_signoff_required: false
  # merge_commit_title/message are inert while allow_merge_commit is false —
  # recorded here so the audit reflects live reality and doesn't drift once
  # merge commits are ever re-enabled.
  merge_commit_title: MERGE_MESSAGE
  merge_commit_message: PR_TITLE
  squash_merge_commit_title: COMMIT_OR_PR_TITLE
  squash_merge_commit_message: COMMIT_MESSAGES
  # security_and_analysis settings — status strings ("enabled"/"disabled"), not
  # booleans, matching the GitHub API's own vocabulary for this nested object.
  # Read/applied by audit_security_settings() in scripts/github-settings.sh, not
  # the generic setting_keys loop (that loop only handles top-level booleans).
  security:
    secret_scanning: enabled
    secret_scanning_push_protection: enabled
    dependabot_security_updates: enabled
  rulesets:
    main-protection:
      # go-kure.github.io is deliberately excluded. It is a GitHub Pages content
      # repo whose default branch is written directly by the kure and launcher
      # deploy-docs workflows and by its own gen-sitemap-index job, and it runs
      # none of the lint/test/build/rebase-check contexts required below.
      repos: [.github, kure, launcher]
      target: branch
      enforcement: active
      conditions:
        ref_name:
          include: ["refs/heads/main"]
      rules:
        deletion: true
        non_fast_forward: true
        required_linear_history: true
        pull_request:
          required_approving_review_count: 0
          dismiss_stale_reviews_on_push: false
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: true
        required_status_checks:
          strict: true
          contexts:
            - lint
            - test
            - build
            - rebase-check
      # Default: no bypass actors
    # GitHub Copilot's automated code review, exposed as a ruleset rule type.
    # enforcement: disabled records live reality (created via the UI, never
    # turned on) rather than changing behavior — flip to "active" to actually
    # enable it. Scoped to kure/launcher only, mirroring how
    # standards/labels.json scopes labels per repo; .github never sees it.
    "Code Quality Copilot review for default branch":
      repos: [kure, launcher]
      target: branch
      enforcement: disabled
      conditions:
        ref_name:
          include: ["~DEFAULT_BRANCH"]
      rules:
        copilot_code_review:
          review_on_push: true
          review_draft_pull_requests: true
      # No bypass actors

github_repos:
  # .github: no overrides (uses defaults: rebase-check + strict + no merge queue)
  #
  # kure and launcher both use a merge queue with the SAME rule override block.
  # allow_auto_merge is now true org-wide (github_defaults above). On kure/launcher
  # the merge queue still governs the actual land — auto-merge only queues a PR
  # once its required checks pass; the queue then does the rebase + merged-result
  # test + linear land. On .github (no queue) auto-merge merges directly once
  # rebase-check + strict status checks pass.
  # kure and launcher's main-protection override is byte-identical (verified
  # by diffing the live rulesets) — folded via a YAML anchor rather than
  # promoted into github_defaults, since that would force .github to express
  # "explicitly no merge_queue" (a concept this schema has no way to state)
  # and would default the release-bot bypass actor onto .github too.
  kure:
    has_discussions: true
    rulesets:
      main-protection: &queue_protection
        bypass_actors:
          # kure-release-bot GitHub App (app_id: 2882845)
          - actor_id: 2882845
            actor_type: Integration
            bypass_mode: always
        # Per-repo rule overrides: the merge queue tests the real merged result,
        # so rebase-check and strict up-to-date enforcement are no longer needed.
        #
        # `pr-review / AI Code Review` is required here (go-kure/.github#108) now that
        # PR_REVIEW_THREADS_MODE=enforce is the org's live and declared state — this closes
        # the auto-merge timing race a red-but-not-required run left open. Deliberately NOT
        # added to .github's own contexts list (org default, above): .github's PR2 of its
        # own two-PR pin-bump sequence would deadlock against its own required check while
        # fixing the placeholder pin that makes the job fail — see docs/standards.md's
        # "Interim outage window" section. kure/launcher have no equivalent problem, since
        # their fix lands in a different repo (.github) than the one enforcing the check.
        rules:
          required_status_checks:
            strict: false
            contexts:
              - lint
              - test
              - build
              - pr-review / AI Code Review
          merge_queue:
            merge_method: REBASE                 # preserves linear history
            grouping_strategy: ALLGREEN          # drop any failing entry from the group
            min_entries_to_merge: 1              # conservative sizing
            max_entries_to_merge: 1
            max_entries_to_build: 1              # tune up after observing runner load
            min_entries_to_merge_wait_minutes: 0
            check_response_timeout_minutes: 60
  launcher:
    rulesets:
      main-protection: *queue_protection

# Organization-level settings — no per-repo override tier (an org has no
# per-repo variants), so unlike github_defaults/github_repos above these are
# read straight from this block by org_policy_json(). Only touched behind
# --org; every other invocation (--all, single-repo, the settings.yml daily
# run) never reads this section and never needs a token with admin:org.
#
# Values below were captured verbatim from `gh api orgs/go-kure` and
# `gh api orgs/go-kure/actions/permissions[/workflow]` via --org --import, so
# the first --org --apply is a no-op. In particular the eight
# *_enabled_for_new_repositories flags are FALSE here, matching live
# reality — flipping them to true (tightening new-repo security defaults) is
# a deliberate follow-up change, not something this commit does.
#
# Four keys below (two_factor_requirement_enabled,
# advanced_security_enabled_for_new_repositories, default_repository_branch,
# members_allowed_repository_creation_type) are audit-only: readable via GET
# but not writable via PATCH /orgs/{org} (see ORG_READONLY_KEYS in
# scripts/github-settings.sh) — audited normally, never PATCHed.
#
# Organization-level rulesets are NOT modeled: GET /orgs/go-kure/rulesets
# returns HTTP 403 "Upgrade to GitHub Team to enable this feature" — a
# billing-tier limit, not a token scope. Revisit if the org ever upgrades.
github_org:
  default_repository_permission: read
  members_can_create_repositories: true
  members_can_create_public_repositories: true
  members_can_create_private_repositories: true
  members_can_create_internal_repositories: false
  members_can_fork_private_repositories: false
  members_can_delete_repositories: true
  members_can_change_repo_visibility: true
  members_can_delete_issues: false
  members_can_invite_outside_collaborators: true
  members_can_create_pages: true
  members_can_create_public_pages: true
  members_can_create_private_pages: true
  members_can_create_teams: true
  has_organization_projects: true
  has_repository_projects: true
  readers_can_create_discussions: true
  members_can_view_dependency_insights: true
  display_commenter_full_name_setting_enabled: false
  deploy_keys_enabled_for_repositories: false
  web_commit_signoff_required: false
  dependabot_alerts_enabled_for_new_repositories: false
  dependabot_security_updates_enabled_for_new_repositories: false
  dependency_graph_enabled_for_new_repositories: false
  secret_scanning_enabled_for_new_repositories: false
  secret_scanning_push_protection_enabled_for_new_repositories: false
  secret_scanning_push_protection_custom_link_enabled: false
  secret_scanning_validity_checks_enabled: false
  # audit-only (see header note above) — never PATCHed
  two_factor_requirement_enabled: true
  advanced_security_enabled_for_new_repositories: false
  default_repository_branch: main
  members_allowed_repository_creation_type: all
  # -> /orgs/{org}/actions/permissions[/workflow], both PUT full-replace
  actions:
    enabled_repositories: all
    allowed_actions: all
    sha_pinning_required: true
    default_workflow_permissions: read
    can_approve_pull_request_reviews: false
