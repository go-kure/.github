[tools]
# Source of truth: ci.yml and settings.yml each read these versions at runtime
# (their "Read <tool> version from mise.toml" steps), so bumping a version here
# is the only edit needed — local runs and CI can no longer diverge. (git-cliff's
# pin is the one exception to "under [tools]"; see [env] below.)
actionlint = "1.7.12"
shellcheck = "0.11.0"
yq = "4.54.3"
lychee = "0.24.2"
# renovate 44 declares engines.node ^24.11.0 (npm refuses to install it on an
# older runtime) -- needed only to run scripts/test/renovate-lane-policy-test.mjs.
node = "24"

# git-cliff is not under [tools]: mise would install it from its own backend and
# skip scripts/release/install-git-cliff.sh, which verifies the release signature
# against a pinned key. The pin lives here as a plain variable instead, and the
# tools:git-cliff task installs it through that script, into a directory inside
# the checkout so no sudo is needed. This is the one place the version is
# written: the script reads this line itself, so ci.yml, release.yml and
# release-publish.yml carry no copy (check-mise-ci-parity.sh refuses one), and
# Renovate bumps only this line.
[env]
# renovate: datasource=github-releases depName=orhun/git-cliff
GIT_CLIFF_VERSION = "2.14.2"
GIT_CLIFF_INSTALL_DIR = "{{config_root}}/.tools/bin"
_.path = ["{{config_root}}/.tools/bin"]

[tasks.lint]
description = "Lint all workflow YAML"
# -shellcheck= disables actionlint's shellcheck integration, so this task does what ci.yml's lint
# job does: actionlint alone. CI installs only the actionlint binary, so shellcheck is never on its
# PATH and actionlint silently skips the integration there. Locally mise puts the pinned shellcheck
# on PATH for every task, so actionlint found it and reported on scripts embedded in `run:` blocks,
# which are not this repo's shellcheck surface -- that is lint:shell, an explicit file list
# check-mise-ci-parity.sh holds against ci.yml. The result was a task that passed or failed by
# environment rather than by content: green in CI, green in a shell exporting SHELLCHECK_OPTS with
# SC2086 excluded, and red in a clean container with the same commit and the same tool versions.
run = "actionlint -shellcheck="

[tasks."lint:shell"]
description = "shellcheck the scripts this repo ships"
run = "shellcheck scripts/check-doc-sync.sh scripts/check-doc-gate.sh scripts/check-links.sh scripts/exact-array-member.sh scripts/lib/json-schema.sh scripts/test/json-schema-test.sh scripts/check-workflow-refs.sh scripts/github-settings.sh scripts/check-settings-doc.sh scripts/check-action-pins.sh scripts/check-label-docs.sh scripts/govulncheck-gate.sh scripts/check-forbidden-terms.sh scripts/test/check-forbidden-terms-test.sh scripts/check-pin-bump.sh scripts/pr-review-threads.sh scripts/lib/prt/state.sh scripts/lib/prt/json.sh scripts/lib/prt/marker.sh scripts/lib/prt/finding.sh scripts/lib/prt/gh.sh scripts/lib/prt/diff.sh scripts/lib/prt/render.sh scripts/lib/prt/model.sh scripts/lib/prt/reconcile.sh scripts/pr-review-fail-closed-digest.sh scripts/lib/api.sh scripts/pr-ci-health.sh scripts/test/pr-ci-health-test.sh scripts/eval/build-gold.sh scripts/eval/check-gold.sh scripts/eval/review-adapter.sh scripts/eval/judge.sh scripts/eval/run.sh scripts/eval/compare.sh scripts/eval/parse-reviews.sh scripts/test/review-adapter-test.sh scripts/test/build-gold-test.sh scripts/test/judge-test.sh scripts/test/compare-test.sh scripts/release-state.sh scripts/test/release-state-test.sh scripts/release/release.sh scripts/release/publish-policy.sh scripts/release/install-git-cliff.sh scripts/test/release-test.sh scripts/test/install-git-cliff-test.sh scripts/test/release-checkout-pin-test.sh scripts/release/deploy-docs-push.sh scripts/test/deploy-docs-push-test.sh scripts/check-mise-ci-parity.sh scripts/test/check-mise-ci-parity-test.sh scripts/pr-review-runner-boundary-probe.sh scripts/test/pr-review-runner-boundary-probe-test.sh scripts/test/renovate-cache-seed-contract-test.sh scripts/test/review-pool-credentials-test.sh scripts/test/review-pool-revision-test.sh scripts/test/review-pool-material-digest-test.sh scripts/test/review-pool-prompt-rule-test.sh scripts/test/review-pool-callable-test.sh scripts/test/pr-review-proxy-url-test.sh scripts/test/pr-review-producer-gate-test.sh scripts/test/review-pool-config-test.sh scripts/test/release-publish-build-cache-test.sh"

[tasks."check:links"]
description = "Check every internal markdown link resolves"
run = "lychee --offline --no-progress './**/*.md'"

[tasks."check:forbidden-terms"]
description = "Guard against downstream/closed-source references (No Downstream References)"
run = "bash scripts/check-forbidden-terms.sh --full-tree"

[tasks."check:doc-sync"]
description = "Validate docs-map.yaml against the filesystem"
run = "bash scripts/check-doc-sync.sh ."

[tasks."check:doc-gate"]
description = "Check mapped docs changed alongside mapped code (vs. the previous commit)"
run = 'bash scripts/check-doc-gate.sh "$(git rev-parse HEAD~1)" .'

[tasks."check:workflow-refs"]
description = "Guard against AGENTS.md / docs/standards.md / standards/github-workflows.md naming a workflow file that doesn't exist"
run = "bash scripts/check-workflow-refs.sh ."

[tasks."check:action-pins"]
description = "Assert every third-party GitHub Actions ref is a 40-char commit SHA"
run = "bash scripts/check-action-pins.sh ."

[tasks."check:settings-doc"]
description = "Guard against docs/standards.md and the settings policy drifting apart"
run = "bash scripts/check-settings-doc.sh ."

[tasks."check:label-docs"]
description = "Guard against standards/labels.md and standards/labels.json drifting apart"
run = "bash scripts/check-label-docs.sh ."

[tasks."check:pin-bump"]
description = "Guard that a PR touching the pr-review-threads action also bumps its pinned SHA"
run = "bash scripts/check-pin-bump.sh origin/main ."

[tasks."check:mise-ci-parity"]
description = "Guard that lint:shell and test check the same scripts as ci.yml"
run = "bash scripts/check-mise-ci-parity.sh ."

[tasks.check]
description = "Run all repo checks (matches the scripts-smoke-test CI job)"
depends = ["lint:shell", "check:doc-sync", "check:doc-gate", "check:workflow-refs", "check:action-pins", "check:settings-doc", "check:label-docs", "check:pin-bump", "check:mise-ci-parity"]

[tasks."tools:git-cliff"]
description = "Install the pinned git-cliff (signature-verified) into .tools/bin; does nothing when it is already installed"
run = 'bash scripts/release/install-git-cliff.sh'

[tasks.test]
description = "Run this repo's own script test suites"
# release-test.sh runs the real git-cliff, so the suites cannot run without it.
depends = ["tools:git-cliff"]
run = """
bash scripts/test/check-action-pins-test.sh .
bash scripts/test/check-forbidden-terms-test.sh .
bash scripts/test/check-label-docs-test.sh .
bash scripts/test/json-schema-test.sh .
bash scripts/test/github-settings-test.sh .
bash scripts/test/govulncheck-gate-test.sh .
bash scripts/test/pr-review-threads-test.sh .
bash scripts/test/check-pin-bump-test.sh .
bash scripts/test/check-doc-gate-test.sh .
bash scripts/test/pr-review-fail-closed-digest-test.sh .
bash scripts/test/pr-review-runner-boundary-probe-test.sh .
bash scripts/test/pr-review-proxy-url-test.sh .
bash scripts/test/pr-review-producer-gate-test.sh .
bash scripts/test/review-pool-config-test.sh .
bash scripts/test/review-pool-credentials-test.sh .
bash scripts/test/review-pool-revision-test.sh .
bash scripts/test/review-pool-material-digest-test.sh .
bash scripts/test/review-pool-prompt-rule-test.sh .
bash scripts/test/review-pool-callable-test.sh .
bash scripts/test/review-adapter-test.sh .
bash scripts/test/build-gold-test.sh .
bash scripts/test/judge-test.sh .
bash scripts/test/compare-test.sh .
bash scripts/test/release-state-test.sh .
bash scripts/test/pr-ci-health-test.sh .
bash scripts/test/release-test.sh .
bash scripts/test/install-git-cliff-test.sh .
bash scripts/test/release-checkout-pin-test.sh .
bash scripts/test/deploy-docs-push-test.sh .
bash scripts/test/check-mise-ci-parity-test.sh .
bash scripts/test/renovate-cache-seed-contract-test.sh .
bash scripts/test/release-publish-build-cache-test.sh .
RENOVATE_VERSION="$(cat scripts/test/renovate-version)"
npm install --no-save --prefix .renovate-lane-test "renovate@${RENOVATE_VERSION}"
npx --prefix .renovate-lane-test renovate-config-validator --no-global renovate/shared.json
node scripts/test/renovate-lane-policy-test.mjs renovate/shared.json \
  .renovate-lane-test/node_modules/renovate/dist/util/package-rules/index.js
node scripts/test/renovate-git-cliff-pins-test.mjs renovate.json
"""

[tasks.verify]
description = "Run everything CI runs (lint, checks, tests, forbidden-terms, links)"
depends = ["lint", "check", "test", "check:forbidden-terms", "check:links"]

[tasks.settings]
description = "Audit or apply GitHub repo/org settings (dry-run by default — pass --apply to mutate). Forwards args, e.g.: mise run settings -- --org"
run = "bash scripts/github-settings.sh"
raw = true

[tasks."pr-review-digest"]
description = "Scan the org's PR Review runs for fail-closed events (requires GH_TOKEN). Forwards args, e.g.: mise run pr-review-digest -- --window-hours 720 --json"
run = "bash scripts/pr-review-fail-closed-digest.sh"
raw = true
